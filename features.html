<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Конструктивно-технические особенности · Стадион ЛК</title>
<link rel="stylesheet" href="modules.css">
<style>
:root{
  --navy:#131b30; --navy2:#0d1424; --panel:#111a2e; --gold:#c9a227; --gold2:#e0bc45;
  --paper:#e8e6df; --mut:#9aa3b8; --faint:#69707a; --line:rgba(255,255,255,.08);
  --blue:#5fa8c7; --amber:#d9a24a; --red:#c23b2a; --green:#7fb685;
  --mono:'PT Mono',ui-monospace,'Cascadia Mono',Menlo,Consolas,monospace;
}
html{scroll-behavior:smooth}
body{background:var(--navy2);color:var(--paper);font-family:'Inter',system-ui,sans-serif;line-height:1.6;margin:0}
h1,h2,h3{font-family:'Playfair Display','PT Serif',Georgia,serif;font-weight:600}
a{color:var(--gold2);text-decoration:none}
.mono{font-family:var(--mono);letter-spacing:.02em}

/* ---------- каркас ---------- */
.fxRail{position:fixed;top:0;left:0;bottom:0;width:284px;border-right:1px solid var(--line);
  background:var(--navy2);display:flex;flex-direction:column;z-index:40}
.fxBrand{padding:80px 20px 14px;border-bottom:1px solid var(--line)}
.fxBrand b{display:block;font-family:var(--mono);font-size:11px;letter-spacing:.18em;color:var(--gold2);text-transform:uppercase}
.fxBrand span{display:block;margin-top:6px;font-size:12px;color:var(--mut)}
.fxList{flex:1;overflow-y:auto;padding:10px 12px}
.fxItem{display:block;width:100%;text-align:left;background:none;border:0;border-left:2px solid transparent;
  padding:12px 12px 12px 14px;color:var(--paper);cursor:pointer;border-radius:0 8px 8px 0}
.fxItem .n{font-family:var(--mono);font-size:11px;color:var(--gold2);display:block;margin-bottom:3px}
.fxItem .t{display:block;font-size:14.5px;font-weight:600;line-height:1.35}
.fxItem .s{display:block;font-size:11.5px;color:var(--mut);margin-top:3px;line-height:1.4}
.fxItem:hover{background:rgba(255,255,255,.04)}
.fxItem.cur{border-left-color:var(--gold);background:rgba(201,162,39,.08)}
.fxItem.dis{opacity:.42;cursor:default}
.fxItem.dis:hover{background:none}
.fxBack{padding:14px 20px;border-top:1px solid var(--line);display:flex;gap:16px;font-size:12.5px}
.fxBack a{color:var(--mut)}
.fxBack a:hover{color:var(--gold2)}
.fxMain{margin-left:284px;min-height:100vh;padding:0 34px 120px;max-width:1180px}

/* ---------- шапка особенности ---------- */
.fxHead{padding:42px 0 8px}
.fxKick{font-family:var(--mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--gold2)}
.fxHead h1{font-size:clamp(22px,2.6vw,32px);line-height:1.2;margin:10px 0 8px;max-width:30ch}
.fxHead .sub{color:var(--mut);max-width:70ch;font-size:15px}
.fxMeta{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px;align-items:center}
.fxStatus{font-family:var(--mono);font-size:11px;padding:4px 10px;border:1px solid var(--amber);color:var(--amber);border-radius:99px}
.fxDate{font-family:var(--mono);font-size:11px;color:var(--faint);padding:4px 2px}
.fxChips{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:1px;background:var(--line);
  border:1px solid var(--line);margin:22px 0 6px}
.fxChips div{background:var(--navy2);padding:12px 14px}
.fxChips i{display:block;font-style:normal;font-family:var(--mono);font-size:10.5px;color:var(--faint);text-transform:uppercase;letter-spacing:.08em}
.fxChips b{display:block;font-family:var(--mono);font-size:15px;color:var(--paper);margin-top:4px;font-weight:600}

/* ---------- подразделы: кнопки + слайдер ---------- */
.fxTabsWrap{position:sticky;top:0;z-index:30;background:var(--navy2);border-bottom:1px solid var(--line);
  display:flex;align-items:stretch;padding-top:10px}
.fxTabs{flex:1;display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
.fxTabs::-webkit-scrollbar{display:none}
.fxTab{flex:0 0 auto;background:none;border:0;border-bottom:2px solid transparent;color:var(--mut);
  font-family:var(--mono);font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;
  padding:9px 13px 11px;cursor:pointer;white-space:nowrap}
.fxTab .dot{display:inline-block;width:6px;height:6px;border-radius:99px;background:var(--faint);margin-right:7px;vertical-align:1px}
.fxTab.cur{color:var(--gold2);border-bottom-color:var(--gold)}
.fxTab.cur .dot{background:var(--gold2);animation:fxPulse 2.2s infinite}
@keyframes fxPulse{0%,100%{box-shadow:0 0 0 0 rgba(224,188,69,.5)}50%{box-shadow:0 0 0 5px rgba(224,188,69,0)}}
.fxArr{flex:0 0 auto;background:none;border:0;color:var(--gold2);font-family:var(--mono);font-size:17px;
  padding:0 9px;cursor:pointer;line-height:1}
.fxArr:disabled{color:var(--faint);opacity:.35;cursor:default}
.fxArr:not(:disabled):hover{color:#fff}
.fxStage{overflow:hidden}
.fxTrack{display:flex;align-items:flex-start;will-change:transform;
  transition:transform .38s cubic-bezier(.22,1,.36,1),height .3s ease}
.fxPane{flex:0 0 100%;min-width:0;padding:26px 0 10px}
@keyframes fxIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.fxPane h2{font-size:clamp(19px,2.2vw,25px);margin:0 0 6px;max-width:46ch}
.fxPane .lead{color:var(--mut);font-size:14.5px;max-width:78ch}
.fxNum{font-family:var(--mono);font-size:11px;letter-spacing:.16em;color:var(--faint);text-transform:uppercase;display:block;margin-bottom:8px}

/* ---------- карточки ---------- */
.fxCards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);margin-top:18px}
.fxCards .c{background:var(--navy2);padding:14px 16px}
.fxCards .k{font-size:12.5px;color:var(--mut);line-height:1.45}
.fxCards .v{display:block;font-family:var(--mono);font-size:15.5px;margin-top:6px;color:var(--paper)}
.fxCards .src{display:inline-block;margin-top:8px;font-family:var(--mono);font-size:10px;color:var(--blue);
  border:1px solid rgba(95,168,199,.35);padding:2px 7px;border-radius:99px}
.fxFoot{margin-top:14px;font-size:13px;color:var(--mut);border-left:2px solid var(--gold);padding:8px 14px;max-width:80ch}

/* ---------- схема-план ---------- */
.fxPlan{border:1px solid var(--line);background:var(--panel);padding:14px;margin-top:16px}
.fxPlan svg{width:100%;height:auto;display:block}
.fxNote{font-family:var(--mono);font-size:10.5px;color:var(--faint);margin-top:10px}
.fxParams{margin-top:18px;display:grid;grid-template-columns:repeat(auto-fill,minmax(255px,1fr));gap:1px;background:var(--line);border:1px solid var(--line)}
.fxParams div{background:var(--navy2);padding:13px 15px}
.fxParams b{display:block;font-size:13px;color:var(--gold2);font-family:var(--mono);font-weight:600}
.fxParams i{display:block;font-style:normal;font-size:12px;color:var(--mut);margin-top:4px;line-height:1.45}

/* ---------- тепловой расчёт ---------- */
.fxHeat{border:1px solid var(--line);background:var(--panel);padding:20px;margin-top:16px}
.fxHeatTop{display:flex;flex-wrap:wrap;gap:22px;align-items:flex-end;justify-content:space-between}
.fxSlider{flex:1 1 300px}
.fxSlider input{width:100%;accent-color:var(--gold2)}
.fxSlider .lab{font-family:var(--mono);font-size:11px;color:var(--mut);display:flex;justify-content:space-between}
.fxBig{text-align:right}
.fxBig .mw{font-family:var(--mono);font-size:clamp(26px,3.4vw,38px);color:var(--gold2);line-height:1.05}
.fxBig .gc{font-family:var(--mono);font-size:12px;color:var(--mut);margin-top:4px}
.fxBars{margin-top:20px;display:grid;gap:12px}
.fxBar .bl{display:flex;justify-content:space-between;font-family:var(--mono);font-size:11px;color:var(--mut);margin-bottom:4px}
.fxBar .track{height:14px;background:rgba(255,255,255,.05);position:relative}
.fxBar .fill{position:absolute;top:0;bottom:0;left:0;background:linear-gradient(90deg,rgba(201,162,39,.55),var(--gold2));
  transition:width .35s cubic-bezier(.22,1,.36,1)}
.fxBar .band{position:absolute;top:0;bottom:0;background:rgba(95,168,199,.30);border-left:1px solid var(--blue);border-right:1px solid var(--blue);transition:all .35s}
.fxHeat details{margin-top:16px}
.fxHeat summary{cursor:pointer;font-family:var(--mono);font-size:11.5px;color:var(--blue);text-transform:uppercase;letter-spacing:.08em}
.fxHeat .asm{margin-top:10px;font-size:12.5px;color:var(--mut);max-width:78ch}

/* ---------- снеговые мешки ---------- */
.fxMeshki{display:grid;grid-template-columns:1.25fr .95fr;gap:20px;margin-top:16px;align-items:start}
.fxScheme{border:1px solid var(--line);background:var(--panel);padding:12px;position:sticky;top:56px}
.fxScheme svg{width:100%;height:auto;display:block}
.fxVars{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:14px}
.fxVar{border:1px solid var(--line);background:none;color:var(--mut);border-radius:99px;padding:7px 13px;
  font-family:var(--mono);font-size:11px;cursor:pointer;letter-spacing:.03em}
.fxVar .dot{display:inline-block;width:6px;height:6px;border-radius:99px;background:var(--faint);margin-right:6px;vertical-align:1px}
.fxVar:hover{border-color:var(--gold);color:var(--paper)}
.fxVar.cur{border-color:var(--gold2);color:var(--gold2);background:rgba(201,162,39,.08)}
.fxVar.cur .dot{background:var(--gold2);animation:fxPulse 2.2s infinite}
.fxVPanel{border:1px solid var(--line);background:var(--panel);padding:18px 18px 16px;animation:fxIn .4s cubic-bezier(.22,1,.36,1)}
.fxVPanel h3{margin:0 0 2px;font-size:17px;line-height:1.3}
.fxVStatus{display:inline-block;font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;
  padding:3px 9px;border-radius:99px;margin:6px 0 10px}
.stPractice{border:1px solid rgba(95,168,199,.5);color:var(--blue)}
.stNorm{border:1px solid rgba(127,182,133,.5);color:var(--green)}
.stProject{border:1px solid rgba(224,188,69,.55);color:var(--gold2)}
.fxVPanel p{font-size:13.5px;color:var(--paper);margin:8px 0}
.fxVPanel .k{color:var(--mut)}
.fxVPanel .k b{color:var(--gold2);font-weight:600}
.fxVPanel .src{font-family:var(--mono);font-size:10.5px;color:var(--faint);border-top:1px dashed var(--line);padding-top:9px;margin-top:12px}

/* ---------- таймлайн аварий ---------- */
.fxTime{margin-top:18px;border-left:1px solid var(--line);padding-left:0}
.fxEv{display:grid;grid-template-columns:86px 1fr;gap:16px;padding:16px 0 16px 18px;border-bottom:1px solid var(--line);position:relative}
.fxEv::before{content:'';position:absolute;left:-4.5px;top:24px;width:8px;height:8px;border-radius:99px;background:var(--red)}
.fxEv .y{font-family:var(--mono);font-size:22px;color:var(--red);line-height:1.1}
.fxEv h3{margin:0 0 6px;font-size:16.5px}
.fxEv p{margin:0 0 8px;font-size:13.5px;color:var(--mut)}
.fxEv .les{font-size:13px;color:var(--paper);border-left:2px solid var(--gold);padding-left:12px}
.fxEv .les b{color:var(--gold2);font-family:var(--mono);font-size:10.5px;text-transform:uppercase;letter-spacing:.1em;display:block;margin-bottom:3px}

/* ---------- чек-листы ---------- */
.fxGroups{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:18px;margin-top:18px}
.fxGroup{border:1px solid var(--line);background:var(--panel);padding:18px}
.fxGroup h3{margin:0 0 12px;font-size:16px}
.fxGroup ul{list-style:none;margin:0;padding:0}
.fxGroup li{font-size:13px;color:var(--mut);padding:9px 0 9px 24px;border-top:1px solid var(--line);position:relative;line-height:1.5}
.fxGroup li::before{content:'';position:absolute;left:2px;top:15px;width:9px;height:9px;border:1px solid var(--gold2);transform:rotate(45deg)}

/* ---------- выводы ---------- */
.fxConcl{counter-reset:cx;margin-top:18px}
.fxConcl li{list-style:none;counter-increment:cx;position:relative;padding:14px 0 14px 56px;border-bottom:1px solid var(--line);
  font-size:14.5px;max-width:82ch}
.fxConcl li::before{content:counter(cx,decimal-leading-zero);position:absolute;left:0;top:14px;
  font-family:var(--mono);font-size:13px;color:var(--gold2)}
.fxSrc{margin-top:22px}
.fxSrc summary{cursor:pointer;font-family:var(--mono);font-size:11.5px;color:var(--blue);text-transform:uppercase;letter-spacing:.08em}
.fxSrc ol{margin:12px 0 0;padding-left:20px}
.fxSrc li{font-size:12.5px;color:var(--mut);margin-bottom:7px}

/* ---------- вместимость: график спроса и барьеры ---------- */
.fxChart{border:1px solid var(--line);background:var(--panel);padding:16px;margin-top:16px}
.fxChart svg{width:100%;height:auto;display:block}
.fxGrow{transform-box:fill-box;transform-origin:50% 100%;animation:fxGrow .9s cubic-bezier(.22,1,.36,1) both}
@keyframes fxGrow{from{transform:scaleY(0)}to{transform:scaleY(1)}}
.fxBarr{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px;margin-top:18px}
.fxBarr .b{border:1px solid var(--line);background:var(--panel);padding:14px 16px}
.fxBarr .l{font-family:var(--mono);font-size:20px;color:var(--red);line-height:1}
.fxBarr .b h3{margin:8px 0 5px;font-size:15.5px}
.fxBarr .b p{margin:0;font-size:12.5px;color:var(--mut);line-height:1.5}

/* ---------- вместимость: калибровка по аренам ---------- */
.fxHB{border:1px solid var(--line);background:var(--panel);padding:6px 16px 14px;margin-top:16px}
.fxHRow{display:grid;grid-template-columns:190px 1fr 96px;gap:12px;align-items:center;padding:11px 0;border-top:1px solid var(--line)}
.fxHRow:first-of-type{border-top:0}
.fxHRow .who b{display:block;font-size:13.5px}
.fxHRow .who i{display:block;font-style:normal;font-family:var(--mono);font-size:10px;color:var(--faint);margin-top:2px;line-height:1.45}
.fxHRow .trk{position:relative;height:20px;background:rgba(255,255,255,.05)}
.fxHRow .fill2,.fxSRow .fill2{position:absolute;top:0;bottom:0;left:0;width:0;transition:width .9s cubic-bezier(.22,1,.36,1)}
.fxHRow .val{text-align:right}
.fxHRow .val b{display:block;font-family:var(--mono);font-size:15px}
.fxHRow .val i{display:block;font-style:normal;font-family:var(--mono);font-size:9.5px;color:var(--faint);margin-top:2px}
.fillGood{background:linear-gradient(90deg,rgba(127,182,133,.45),#7fb685)}
.fillMid{background:linear-gradient(90deg,rgba(201,162,39,.5),#e0bc45)}
.fillBad{background:linear-gradient(90deg,rgba(194,59,42,.40),#c23b2a)}
.fxZone{position:absolute;top:-4px;bottom:-4px;background:rgba(224,188,69,.10);border-left:1px dashed rgba(224,188,69,.55);border-right:1px dashed rgba(224,188,69,.55);pointer-events:none}
.fxMlb{position:absolute;top:-6px;bottom:-6px;width:0;border-left:1px dashed rgba(255,255,255,.55);pointer-events:none}
.fxLegend{display:flex;flex-wrap:wrap;gap:16px;margin-top:12px;font-family:var(--mono);font-size:10px;color:var(--mut);text-transform:uppercase;letter-spacing:.06em}
.fxLegend span::before{content:'';display:inline-block;width:14px;height:8px;margin-right:7px}
.fxLegend .lgG::before{background:#7fb685}
.fxLegend .lgM::before{background:#e0bc45}
.fxLegend .lgB::before{background:#c23b2a}
.fxLegend .lgZ::before{background:rgba(224,188,69,.12);border-left:1px dashed rgba(224,188,69,.6);border-right:1px dashed rgba(224,188,69,.6)}
.fxLegend .lgL::before{background:none;border-top:1px dashed rgba(255,255,255,.55);height:0;vertical-align:3px}

/* ---------- вместимость: факторная модель ---------- */
.fxFGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px;margin-top:16px}
.fxF{border:1px solid var(--line);background:var(--panel);padding:16px;display:flex;flex-direction:column}
.fxF .hd{display:flex;justify-content:space-between;align-items:center;gap:8px}
.fxF .code{font-family:var(--mono);font-size:15px;color:var(--gold2)}
.fxF h3{margin:9px 0 6px;font-size:15.5px;line-height:1.3}
.fxF p{margin:0;font-size:12.5px;color:var(--mut);line-height:1.5;flex:1}
.fxF .eff{display:inline-block;margin-top:10px;font-family:var(--mono);font-size:16px;color:var(--gold2)}
.fxF .src{margin-top:9px;font-family:var(--mono);font-size:9.5px;color:var(--faint);border-top:1px dashed var(--line);padding-top:8px;line-height:1.55}
.fxBadge{font-family:var(--mono);font-size:9px;letter-spacing:.08em;text-transform:uppercase;padding:2px 8px;border-radius:99px;white-space:nowrap}
.bMeas{border:1px solid rgba(127,182,133,.5);color:var(--green)}
.bLit{border:1px solid rgba(95,168,199,.5);color:var(--blue)}
.bMod{border:1px solid rgba(217,162,74,.55);color:var(--amber)}
.bReq{border:1px solid rgba(255,255,255,.25);color:var(--mut)}
.fxConsole{margin-top:20px;border:1px solid rgba(201,162,39,.45);background:linear-gradient(180deg,rgba(201,162,39,.07),rgba(201,162,39,.02));padding:20px}
.fxConsole .ttl{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold2)}
.fxSPills{display:flex;flex-wrap:wrap;gap:7px;margin:14px 0 12px}
.fxSPill{border:1px solid var(--line);background:none;color:var(--mut);border-radius:99px;padding:7px 13px;
  font-family:var(--mono);font-size:11px;cursor:pointer;letter-spacing:.03em}
.fxSPill:hover{border-color:var(--gold);color:var(--paper)}
.fxSPill.cur{border-color:var(--gold2);color:var(--gold2);background:rgba(201,162,39,.10)}
.fxTogs{display:grid;grid-template-columns:repeat(auto-fit,minmax(215px,1fr));gap:8px}
.fxTog{display:flex;align-items:center;gap:10px;border:1px solid var(--line);background:var(--navy2);padding:9px 12px;cursor:pointer;user-select:none}
.fxTog .sw{width:30px;height:16px;border-radius:99px;background:rgba(255,255,255,.12);position:relative;flex:0 0 auto;transition:background .2s}
.fxTog .sw::after{content:'';position:absolute;top:2px;left:2px;width:12px;height:12px;border-radius:99px;background:var(--mut);transition:left .2s,background .2s}
.fxTog.on .sw{background:rgba(201,162,39,.5)}
.fxTog.on .sw::after{left:16px;background:var(--gold2)}
.fxTog .tx b{display:block;font-family:var(--mono);font-size:11px;color:var(--paper);font-weight:600}
.fxTog .tx i{display:block;font-style:normal;font-size:10.5px;color:var(--mut);margin-top:1px}
.fxCalcOut{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:1px;background:rgba(201,162,39,.30);border:1px solid rgba(201,162,39,.30);margin-top:16px}
.fxCalcOut>div{background:var(--navy2);padding:12px 14px}
.fxCalcOut i{display:block;font-style:normal;font-family:var(--mono);font-size:9.5px;color:var(--faint);text-transform:uppercase;letter-spacing:.08em}
.fxCalcOut b{display:block;font-family:var(--mono);font-size:19px;color:var(--gold2);margin-top:5px;font-weight:600}
.fxCalcOut .s2{display:block;font-family:var(--mono);font-size:10px;color:var(--mut);margin-top:2px}
.fxCalcNote{margin-top:12px;font-size:12px;color:var(--mut);max-width:95ch;line-height:1.55}

/* ---------- вместимость: сценарии ---------- */
.fxScen{border:1px solid var(--line);background:var(--panel);padding:16px 18px;margin-top:14px}
.fxScen .hd{display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px;align-items:baseline}
.fxScen .hd h3{margin:0;font-size:16.5px}
.fxScen .hd .calc{font-family:var(--mono);font-size:11.5px;color:var(--gold2)}
.fxScen .rows{margin-top:12px;display:grid;gap:9px}
.fxSRow{display:grid;grid-template-columns:160px 1fr 128px;gap:10px;align-items:center}
.fxSRow .lb{font-family:var(--mono);font-size:10px;color:var(--mut);text-transform:uppercase;letter-spacing:.06em}
.fxSRow .trk{position:relative;height:16px;background:rgba(255,255,255,.05)}
.fxSRow .vl{font-family:var(--mono);font-size:12px;text-align:right;color:var(--paper)}
.fxBand{position:absolute;top:0;bottom:0;background:rgba(194,59,42,.16);border-left:1px solid var(--red);border-right:1px solid var(--red);transition:left .9s cubic-bezier(.22,1,.36,1),width .9s cubic-bezier(.22,1,.36,1)}
.fxWarn{margin-top:12px;font-size:12.5px;color:#e08a7d;border-left:2px solid var(--red);padding-left:10px}
.fxCorridor{margin-top:20px;border:1px solid rgba(201,162,39,.5);background:rgba(201,162,39,.08);padding:16px 20px;
  font-family:var(--mono);font-size:14px;color:var(--gold2);display:flex;flex-wrap:wrap;gap:8px 22px;align-items:baseline}
.fxCorridor b{font-size:22px;font-weight:600}

/* ---------- вместимость: резерв и рекомендация ---------- */
.fxVerdict{margin-top:18px;border:1px solid rgba(201,162,39,.45);background:linear-gradient(180deg,rgba(201,162,39,.09),transparent);padding:28px 22px;text-align:center}
.fxVerdict .big{font-family:'Playfair Display','PT Serif',Georgia,serif;font-size:clamp(46px,7vw,84px);line-height:1;color:var(--gold2)}
.fxVerdict .cap{font-family:var(--mono);font-size:12px;color:var(--mut);margin-top:10px}
.fxVerdict .ext{margin-top:16px;display:inline-block;border:1px dashed rgba(224,188,69,.6);color:var(--gold2);border-radius:99px;padding:8px 18px;font-family:var(--mono);font-size:11.5px;line-height:1.5;max-width:640px}
.fxScale{border:1px solid var(--line);background:var(--panel);padding:14px;margin-top:18px}
.fxScale svg{width:100%;height:auto;display:block}
.fxProg{margin-top:18px;display:grid;grid-template-columns:repeat(auto-fill,minmax(255px,1fr));gap:8px}
.fxProg div{border:1px solid var(--line);background:var(--navy2);padding:10px 13px;font-size:12.5px;color:var(--mut);display:flex;gap:10px;align-items:baseline;line-height:1.45}
.fxProg div::before{content:'';flex:0 0 auto;width:8px;height:8px;border:1px solid var(--gold2);transform:rotate(45deg)}
.fxBim{margin-top:16px;border-left:2px solid var(--green);background:rgba(127,182,133,.07);padding:12px 16px;font-size:13.5px;color:var(--paper);max-width:95ch}

/* ----- особенность 02 «Фундамент под пилоны» ----- */
.fxWarn{border-left:3px solid var(--red);background:rgba(194,59,42,.08);padding:13px 16px;margin-top:16px;
  font-size:13px;line-height:1.65;color:var(--paper)}
.fxWarn b{color:var(--red);font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;display:block;margin-bottom:5px}
.fxGeoWrap{display:grid;grid-template-columns:430px 1fr;gap:14px;margin-top:16px}
.fxGeoSvg{border:1px solid var(--line);background:var(--panel);padding:14px}
.fxGeoSvg svg{width:100%;height:auto;display:block}
.fxGeoFacts{display:flex;flex-direction:column;gap:10px}
.fxGeoFacts .fxCards{margin-top:0}
.fxVGrid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}
.fxV{border:1px solid var(--line);background:var(--panel);padding:18px 18px 14px;position:relative}
.fxV .vid{font-family:var(--mono);font-size:11px;color:var(--gold2);letter-spacing:.1em}
.fxV h4{font-size:19px;margin:6px 0 10px;line-height:1.3}
.fxV ul{margin:0;padding:0;list-style:none}
.fxV li{font-size:13px;color:var(--mut);line-height:1.55;padding:5px 0 5px 16px;position:relative;border-top:1px dashed rgba(255,255,255,.07)}
.fxV li::before{content:'—';position:absolute;left:0;color:var(--gold)}
.fxV .rib{position:absolute;top:0;right:0;font-family:var(--mono);font-size:9px;letter-spacing:.14em;text-transform:uppercase;
  padding:5px 12px;border:1px solid;border-top:0;border-right:0}
.vRej .rib{color:#e08a7d;border-color:rgba(194,59,42,.5);background:rgba(194,59,42,.12)}
.vRes .rib{color:var(--amber);border-color:rgba(217,162,74,.5);background:rgba(217,162,74,.10)}
.vOk{border-color:rgba(201,162,39,.55);box-shadow:inset 0 0 0 1px rgba(201,162,39,.25),0 0 34px rgba(201,162,39,.06)}
.vOk .rib{color:var(--gold2);border-color:var(--gold);background:rgba(201,162,39,.14)}
.fxPc{display:grid;grid-template-columns:340px 1fr;gap:14px;margin-top:16px;align-items:start}
.fxPcSvg{border:1px solid var(--line);background:var(--panel);padding:12px}
.fxPcSvg svg{width:100%;height:auto;display:block}
.fxPcPanel{border:1px solid var(--line);background:var(--panel);padding:18px}
.fxPcForm{font-family:var(--mono);font-size:11px;color:var(--mut);line-height:1.7;border-bottom:1px dashed rgba(255,255,255,.12);padding-bottom:10px;margin-bottom:12px}
.fxPcForm b{color:var(--paper)}
.fxPcNums{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:14px 0}
.fxPcNums>div{border:1px solid var(--line);padding:10px 12px;background:rgba(255,255,255,.02)}
.fxPcNums i{display:block;font-style:normal;font-family:var(--mono);font-size:9px;color:var(--mut);text-transform:uppercase;letter-spacing:.08em;margin-bottom:5px}
.fxPcNums b{font-family:var(--mono);font-size:19px;color:var(--paper)}
.fxPcNums b.g{color:var(--gold2)}
.fxBar{position:relative;height:26px;background:rgba(255,255,255,.05);margin:28px 0 4px}
.fxBar .seg{position:absolute;top:0;bottom:0;left:0;width:0;transition:width .9s cubic-bezier(.22,1,.36,1)}
.segF{background:linear-gradient(90deg,rgba(95,168,199,.4),#5fa8c7)}
.segE{background:linear-gradient(90deg,rgba(201,162,39,.5),#e0bc45)}
.fxBar .req{position:absolute;top:-6px;bottom:-6px;width:0;border-left:2px dashed var(--red)}
.fxBar .reqT{position:absolute;top:-19px;transform:translateX(-50%);font-family:var(--mono);font-size:9px;color:var(--red);white-space:nowrap}
.fxBarLb{display:flex;justify-content:space-between;font-family:var(--mono);font-size:10px;color:var(--mut);text-transform:uppercase;letter-spacing:.07em;margin-top:22px}
.fxBarLb b{color:var(--paper)}
.fxVd{margin-top:14px;padding:12px 16px;border:1px solid;font-family:var(--mono);font-size:12px;letter-spacing:.05em;text-transform:uppercase}
.fxVd small{display:block;font-size:10px;color:var(--mut);letter-spacing:.06em;margin-top:4px;text-transform:none}
.vdBad{border-color:rgba(194,59,42,.6);color:#e08a7d;background:rgba(194,59,42,.10)}
.vdMid{border-color:rgba(217,162,74,.6);color:var(--amber);background:rgba(217,162,74,.08)}
.vdGood{border-color:rgba(127,182,133,.6);color:var(--green);background:rgba(127,182,133,.08)}
.vdRock{border-color:rgba(201,162,39,.7);color:var(--gold2);background:rgba(201,162,39,.10)}
.fxKey{border-left:3px solid var(--gold);background:rgba(201,162,39,.07);padding:13px 16px;margin-top:14px;font-size:13px;line-height:1.65}
.fxChkGrid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}
.fxChk{border:1px solid var(--line);background:var(--panel);padding:16px 18px}
.fxChk .nm{font-size:15px;font-weight:700;margin-bottom:6px;padding-right:150px}
.fxChk .vl{font-family:var(--mono);font-size:15px;color:var(--gold2);margin-bottom:6px}
.fxChk .ds{font-size:12px;color:var(--mut);line-height:1.55}
.fxChk .res{float:right;font-family:var(--mono);font-size:9px;letter-spacing:.12em;text-transform:uppercase;padding:4px 10px;border:1px solid}
.resOk{color:var(--green);border-color:rgba(127,182,133,.5);background:rgba(127,182,133,.08)}
.resStage{color:var(--amber);border-color:rgba(217,162,74,.5);background:rgba(217,162,74,.08)}
.fxFg{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:16px}
.fxFg .box{border:1px solid var(--line);background:var(--panel);padding:14px}
.fxFg .box>h5{font-family:var(--mono);font-size:10px;color:var(--mut);text-transform:uppercase;letter-spacing:.12em;margin:0 0 8px;font-weight:400}
.fxFg svg{width:100%;height:auto;display:block}
.fxSpecs{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:14px}
.fxSpec{border:1px solid var(--line);background:var(--panel);padding:14px 16px}
.fxSpec h5{margin:0 0 8px;font-size:16px;color:var(--gold2)}
.fxSpec table{width:100%;border-collapse:collapse;font-size:12px}
.fxSpec td{padding:5px 0;border-top:1px dashed rgba(255,255,255,.07);vertical-align:top;line-height:1.5}
.fxSpec td:first-child{font-family:var(--mono);font-size:10px;color:var(--mut);text-transform:uppercase;letter-spacing:.06em;width:118px;padding-right:10px}
.fxSteps{margin-top:16px;border:1px solid var(--line);background:var(--panel)}
.fxStep{display:grid;grid-template-columns:64px 1fr;gap:14px;padding:16px 18px;border-top:1px solid var(--line)}
.fxStep:first-child{border-top:0}
.fxStep .n{font-family:var(--mono);font-size:22px;color:var(--gold2)}
.fxStep h5{margin:0 0 5px;font-size:16px}
.fxStep p{margin:0;font-size:13px;color:var(--mut);line-height:1.6}
.fxStep .fxBadge{margin-left:10px;vertical-align:2px}
/* ---------- мобильная адаптация ---------- */
@media(max-width:960px){
  .fxRail{position:static;width:auto;border-right:0;border-bottom:1px solid var(--line)}
  .fxList{display:flex;overflow-x:auto;gap:6px;padding:10px}
  .fxItem{flex:0 0 220px;border:1px solid var(--line);border-radius:10px;border-left-width:1px}
  .fxItem.cur{border-color:var(--gold)}
  .fxBack{justify-content:center}
  .fxMain{margin-left:0;padding:0 16px 90px}
  .fxMeshki{grid-template-columns:1fr}
  .fxScheme{position:static}
  .fxBig{text-align:left}
  .fxEv{grid-template-columns:56px 1fr;gap:10px}
  .fxHRow{grid-template-columns:118px 1fr 78px}
  .fxSRow{grid-template-columns:104px 1fr 96px}
  .fxCalcOut b{font-size:16px}
  .fxGeoWrap,.fxPc{grid-template-columns:1fr}
  .fxVGrid,.fxChkGrid,.fxFg,.fxSpecs{grid-template-columns:1fr}
  .fxChk .nm{padding-right:110px}
  .fxPcNums{grid-template-columns:1fr 1fr}
}
@media print{.fxRail,.fxTabsWrap,.fxVars{display:none}.fxMain{margin:0}.fxStage{overflow:visible}.fxTrack{display:block;transform:none!important;height:auto!important}}
</style>
</head>
<body>

<aside class="fxRail">
  <div class="fxBrand"><b>Стадион ЛК · КТО</b><span>Конструктивно-технические особенности · интерактивные разборы</span></div>
  <div class="fxList" id="fxList"></div>
  <div class="fxBack"><a href="index.html">← К модулям проекта</a><a href="#" id="fxClose">Закрыть окно ✕</a></div>
</aside>

<main class="fxMain" id="fxMain"></main>

<script src="features-data.js"></script>
<script>
(function(){
  const qp=new URLSearchParams(location.search);
  let curId=qp.get('f')||FEATURES[0].id;

  /* ---------- рейка особенностей ---------- */
  const list=document.getElementById('fxList');
  FEATURES.forEach(f=>{
    const b=document.createElement('button');
    b.className='fxItem'+(f.id===curId?' cur':'')+(f.placeholder?' dis':'');
    b.innerHTML='<span class="n">ОСОБЕННОСТЬ '+f.num+'</span><span class="t">'+f.title+'</span>'+
                '<span class="s">'+(f.placeholder?f.subtitle:'открыть разбор')+'</span>';
    if(!f.placeholder)b.addEventListener('click',()=>{curId=f.id;history.replaceState(null,'','?f='+f.id);renderAll();});
    list.appendChild(b);
  });
  document.getElementById('fxClose').addEventListener('click',e=>{e.preventDefault();window.close();});

  function renderAll(){
    list.querySelectorAll('.fxItem').forEach((b,i)=>b.classList.toggle('cur',FEATURES[i].id===curId));
    const f=FEATURES.find(x=>x.id===curId)||FEATURES[0];
    if(f.placeholder)return;
    renderFeature(f);
  }

  /* ---------- шапка + кнопки подразделов + слайдер ---------- */
  const R={plan:rPlan,cards:rCards,heat:rHeat,meshki:rMeshki,timeline:rTimeline,checklist:rChecklist,conclusions:rConclusions,
    demand:rDemand,calib:rCalib,factors:rFactors,scenarios:rScenarios,reserve:rReserve,verdict:rVerdict,
    geology:rGeology,choice:rChoice,pilecalc:rPilecalc,checks:rChecks,foundation:rFoundation,tech:rTech};
  let F=null,cur=0,track=null,stage=null,tabsBar=null,drag=null;

  function renderFeature(f){
    F=f;
    const main=document.getElementById('fxMain');
    main.innerHTML=
      '<header class="fxHead">'+
        '<span class="fxKick">Особенность '+f.num+' · Конструктивно-технический разбор</span>'+
        '<h1>'+f.title+'</h1>'+
        '<div class="sub">'+f.subtitle+'</div>'+
        '<div class="fxMeta"><span class="fxStatus">'+f.status+'</span><span class="fxDate">'+f.date+'</span></div>'+
        '<div class="fxChips">'+f.chips.map(c=>'<div><i>'+c[0]+'</i><b>'+c[1]+'</b></div>').join('')+'</div>'+
      '</header>'+
      '<div class="fxTabsWrap"><button class="fxArr" id="fxPrev" aria-label="Предыдущий подраздел">‹</button>'+
      '<nav class="fxTabs" id="fxTabs"></nav>'+
      '<button class="fxArr" id="fxNext" aria-label="Следующий подраздел">›</button></div>'+
      '<div class="fxStage" id="fxStage"><div class="fxTrack" id="fxTrack"></div></div>';
    tabsBar=document.getElementById('fxTabs');
    stage=document.getElementById('fxStage');
    track=document.getElementById('fxTrack');
    /* все подразделы строятся сразу: слайдер листает готовые панели */
    f.tabs.forEach(t=>{
      const b=document.createElement('button');
      b.className='fxTab';
      b.innerHTML='<span class="dot"></span>'+t.label;
      b.addEventListener('click',()=>setTab(f.tabs.indexOf(t)));
      tabsBar.appendChild(b);
      const sec=document.createElement('section');
      sec.className='fxPane';
      sec.dataset.tab=t.id;
      track.appendChild(sec);          /* сначала в DOM: рендереры ищут свои id по документу */
      R[t.type](sec,f);
    });
    document.getElementById('fxPrev').addEventListener('click',()=>setTab(cur-1));
    document.getElementById('fxNext').addEventListener('click',()=>setTab(cur+1));
    bindSwipe();
    if(window.ResizeObserver){
      const ro=new ResizeObserver(en=>{en.forEach(e=>{if(e.target===track.children[cur])syncH()})});
      Array.from(track.children).forEach(p=>ro.observe(p));
    }
    addEventListener('resize',()=>{setPos(false);syncH()});
    let i0=0;
    const qt=qp.get('t');
    if(qt){const k=f.tabs.findIndex(t=>t.id===qt);if(k>=0)i0=k;}
    setTab(i0,false);
    window.scrollTo({top:0});
  }

  function setPos(anim){
    if(!anim)track.style.transition='none';
    track.style.transform='translateX('+(-cur*100)+'%)';
    if(!anim){void track.offsetHeight;track.style.transition='';}
  }
  function syncH(){const p=track&&track.children[cur];if(p)track.style.height=p.offsetHeight+'px';}
  function setTab(i,anim){
    if(!F)return;
    cur=Math.max(0,Math.min(F.tabs.length-1,i));
    tabsBar.querySelectorAll('.fxTab').forEach((x,k)=>{
      x.classList.toggle('cur',k===cur);
      if(k===cur)x.scrollIntoView({block:'nearest',inline:'nearest'});
    });
    document.getElementById('fxPrev').disabled=(cur===0);
    document.getElementById('fxNext').disabled=(cur===F.tabs.length-1);
    setPos(anim!==false);
    syncH();
    history.replaceState(null,'','?f='+F.id+'&t='+F.tabs[cur].id);
  }

  /* свайп внутри раздела: живой драг, листает только подразделы */
  function bindSwipe(){
    stage.addEventListener('touchstart',e=>{
      if(e.touches.length!==1)return;
      if(e.target.closest('input,select,textarea,a,button,summary,label'))return;
      const t=e.touches[0];
      drag={x:t.clientX,y:t.clientY,dx:0,lock:null};
    },{passive:true});
    stage.addEventListener('touchmove',e=>{
      if(!drag||e.touches.length!==1)return;
      const t=e.touches[0],dx=t.clientX-drag.x,dy=t.clientY-drag.y;
      if(!drag.lock){
        if(Math.abs(dx)<10&&Math.abs(dy)<10)return;
        drag.lock=(Math.abs(dx)>Math.abs(dy)*1.25)?'h':'v';
      }
      if(drag.lock!=='h')return;
      e.preventDefault();
      drag.dx=dx;
      const W=stage.clientWidth;
      let px=-cur*W+dx;
      if((cur===0&&dx>0)||(cur===F.tabs.length-1&&dx<0))px=-cur*W+dx*.35;  /* упругость на краях */
      track.style.transition='none';
      track.style.transform='translateX('+px+'px)';
    },{passive:false});
    const end=()=>{
      if(!drag)return;
      const dx=drag.dx,lk=drag.lock;drag=null;
      track.style.transition='';
      if(lk==='h'&&Math.abs(dx)>56)setTab(cur+(dx<0?1:-1));
      else{setPos(true);syncH();}
    };
    stage.addEventListener('touchend',end,{passive:true});
    stage.addEventListener('touchcancel',end,{passive:true});
  }

  /* стрелки клавиатуры листают подразделы этого раздела */
  document.addEventListener('keydown',e=>{
    if(e.target&&e.target.closest&&e.target.closest('input,select,textarea'))return;
    if(e.key==='ArrowRight')setTab(cur+1);
    else if(e.key==='ArrowLeft')setTab(cur-1);
  });

  function paneHead(pane,num,title,lead){
    pane.innerHTML='<span class="fxNum">'+num+'</span><h2>'+title+'</h2>'+(lead?'<p class="lead">'+lead+'</p>':'');
  }

  /* ---------- 01 · схема-план проёма ---------- */
  function rPlan(pane,f){
    paneHead(pane,'01 / Геометрия','Схема проёма и параметры концепции',f.plan.note);
    const W=800,H=520,x0=90,x1=750,y0=40,y1=452;      // 109 м → x, 68 м → y
    const sw=(x1-x0)/17;
    let strips='';
    for(let i=0;i<17;i++){
      const x=x0+i*sw, odd=(i+1)%2===1, hl=(i===8);
      strips+='<g class="strip" data-t="Полоса №'+(i+1)+' · ширина 6,41 м · пролёт 68 м · выдвижение '+(odd?'с юга':'с севера')+'">'
        +'<rect x="'+x.toFixed(1)+'" y="'+y0+'" width="'+sw.toFixed(1)+'" height="'+(y1-y0)+'" fill="'+(hl?'rgba(201,162,39,.30)':(i%2?'rgba(255,255,255,.05)':'rgba(95,168,199,.10)'))+'" stroke="rgba(255,255,255,.14)" stroke-width="1"/>'
        +'<path d="M'+(x+sw/2).toFixed(1)+' '+(odd?(y1-26):(y0+26))+' v '+(odd?-(y1-y0-52):(y1-y0-52))+'" stroke="'+(hl?'#e0bc45':'rgba(255,255,255,.35)')+'" stroke-width="1.4" marker-end="url(#fxArr)"/>'
        +'<text x="'+(x+sw/2).toFixed(1)+'" y="'+(y0+16)+'" fill="'+(hl?'#e0bc45':'rgba(255,255,255,.4)')+'" font-size="10" font-family="var(--mono)" text-anchor="middle">'+(i+1)+'</text></g>';
    }
    const svg='<svg viewBox="0 0 '+W+' '+H+'">'
      +'<defs><marker id="fxArr" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 z" fill="rgba(224,188,69,.9)"/></marker></defs>'
      +'<rect x="'+(x0-6)+'" y="'+(y0-16)+'" width="'+(x1-x0+12)+'" height="16" fill="rgba(201,162,39,.12)"/>'
      +'<rect x="'+(x0-6)+'" y="'+y1+'" width="'+(x1-x0+12)+'" height="16" fill="rgba(201,162,39,.12)"/>'
      +'<text x="'+((x0+x1)/2)+'" y="'+(y0-4)+'" fill="#c9a227" font-size="11" font-family="var(--mono)" text-anchor="middle">КАССЕТЫ · Y = +34 (чётные полосы, с севера)</text>'
      +'<text x="'+((x0+x1)/2)+'" y="'+(y1+13)+'" fill="#c9a227" font-size="11" font-family="var(--mono)" text-anchor="middle">КАССЕТЫ · Y = −34 (нечётные полосы, с юга)</text>'
      +strips
      +'<text x="'+((x0+x1)/2)+'" y="'+(y1+40)+'" fill="#9aa3b8" font-size="12" font-family="var(--mono)" text-anchor="middle">109 м · ось X от −42 до +67</text>'
      +'<text x="'+(x1+14)+'" y="'+((y0+y1)/2)+'" fill="#9aa3b8" font-size="12" font-family="var(--mono)" transform="rotate(90 '+(x1+14)+' '+((y0+y1)/2)+')" text-anchor="middle">68 м · |Y| ≤ 34</text>'
      +'<text x="'+(x0+8*sw+sw/2)+'" y="'+(y1+40)+'" fill="#e0bc45" font-size="0" font-family="var(--mono)"></text>'
      +'</svg>';
    pane.insertAdjacentHTML('beforeend','<div class="fxPlan">'+svg+
      '<div class="fxNote">СХЕМА В ПЛАНЕ · ПОЛОСА № 9 (ЗОЛОТО) ЛЕЖИТ НА ОСИ ПОЛЯ X = 12,5 М · СТРЕЛКИ — НАПРАВЛЕНИЕ ВЫДВИЖЕНИЯ</div></div>');
    pane.insertAdjacentHTML('beforeend','<div class="fxParams">'+f.plan.params.map(prm=>
      '<div><b>'+prm[0]+' · '+prm[1]+'</b><i>'+prm[2]+'</i></div>').join('')+'</div>');
    pane.querySelectorAll('.strip').forEach(g=>{

    }
    document.getElementById('fxT').addEventListener('input',upd); upd();
  }

  /* ---------- 01 · спрос сейчас: график + барьеры ---------- */
  function rDemand(pane,f){
    const d=f.demand;
    paneHead(pane,'01 / Базис','Фактический спрос: стадион 1967 года на 15 000 мест',d.note);
    const W=860,H=400,base=320,k=260/11000,x0=70,slot=(W-110)/5,bw=66;
    let bars='';
    d.seasons.forEach((s,i)=>{
      const x=x0+i*slot+(slot-bw)/2, h=s.avg*k, y=base-h, rpl=(s.lg==='РПЛ');
      bars+='<rect class="fxGrow" style="animation-delay:'+(i*0.09)+'s" x="'+x.toFixed(1)+'" y="'+y.toFixed(1)+'" width="'+bw+'" height="'+h.toFixed(1)+'" fill="'+(rpl?'rgba(224,188,69,.85)':'rgba(95,168,199,.55)')+'" stroke="'+(rpl?'#e0bc45':'#5fa8c7')+'" stroke-width="1"/>'
        +'<text x="'+(x+bw/2)+'" y="'+(y-24).toFixed(1)+'" fill="'+(rpl?'#e0bc45':'#e8e6df')+'" font-size="15" font-family="var(--mono)" text-anchor="middle" font-weight="600">'+s.fill+' %</text>'
        +'<text x="'+(x+bw/2)+'" y="'+(y-8).toFixed(1)+'" fill="#9aa3b8" font-size="10.5" font-family="var(--mono)" text-anchor="middle">'+nfmt(s.avg)+'</text>'
        +'<text x="'+(x+bw/2)+'" y="'+(base+18)+'" fill="#e8e6df" font-size="12" font-family="var(--mono)" text-anchor="middle">'+s.s+'</text>'
        +'<text x="'+(x+bw/2)+'" y="'+(base+33)+'" fill="#69707a" font-size="9.5" font-family="var(--mono)" text-anchor="middle">'+s.lg.toUpperCase()+'</text>';
      if(s.peak){
        const py=base-s.peak*k;
        bars+='<line x1="'+(x-16)+'" y1="'+py.toFixed(1)+'" x2="'+(x+bw+16)+'" y2="'+py.toFixed(1)+'" stroke="#e0bc45" stroke-width="1" stroke-dasharray="4 3"/>'
          +'<path d="M'+(x+bw/2)+','+(py-8).toFixed(1)+' l6,8 l-6,8 l-6,-8 z" fill="#e0bc45"/>'
          +'<text x="'+(x+bw/2)+'" y="'+(py-16).toFixed(1)+'" fill="#e0bc45" font-size="9.5" font-family="var(--mono)" text-anchor="middle">ПИК '+nfmt(s.peak)+'</text>';
      }
    });
    const ry=base-7723*k;
    const svg='<svg viewBox="0 0 '+W+' '+H+'">'
      +'<line x1="40" y1="'+base+'" x2="'+(W-30)+'" y2="'+base+'" stroke="rgba(255,255,255,.25)"/>'

      +'<text x="'+(W-32)+'" y="'+(ry-6).toFixed(1)+'" fill="#c9a227" font-size="9.5" font-family="var(--mono)" text-anchor="end">РПЛ НА СТАРОМ СТАДИОНЕ: ×2,1 К СРЕДНЕЙ ФНЛ</text>'
      +bars
      +'<text x="42" y="30" fill="#69707a" font-size="9.5" font-family="var(--mono)">СТОЛБЕЦ — СРЕДНЯЯ ПОСЕЩАЕМОСТЬ, ЧЕЛ/МАТЧ · ПОДПИСЬ НАД СТОЛБЦОМ — ЗАПОЛНЯЕМОСТЬ 15 000</text>'
      +'</svg>';
    pane.insertAdjacentHTML('beforeend','<div class="fxChart">'+svg+'</div>');
    pane.insertAdjacentHTML('beforeend','<div class="fxBarr">'+d.barriers.map(b=>
      '<div class="b"><span class="l">'+b[0]+'</span><h3>'+b[1]+'</h3><p>'+b[2]+'</p></div>').join('')+'</div>');
    pane.insertAdjacentHTML('beforeend','<div class="fxFoot">'+d.foot+'</div>');

  function rFactors(pane,f){
    const d=f.factors;

    pane.insertAdjacentHTML('beforeend','<div class="fxFGrid">'+d.list.map(x=>
      '<div class="fxF"><div class="hd"><span class="code">'+x.code+'</span><span class="fxBadge '+x.cls+'">'+x.badge+'</span></div>'+
      '<h3>'+x.title+'</h3><p>'+x.mech+'</p><span class="eff">'+x.eff+'</span><div class="src">'+x.src+'</div></div>').join('')+'</div>');
    pane.insertAdjacentHTML('beforeend',
      '<div class="fxConsole"><span class="ttl">Консоль модели · соберите произведение факторов</span>'+
      '<div class="fxSPills" id="fxCPills">'+d.console.scen.map((s,i)=>
        '<button class="fxSPill'+(i===1?' cur':'')+'" data-i="'+i+'">'+s.label+'</button>').join('')+'</div>'+
      '<div class="fxTogs" id="fxCTogs">'+d.list.filter(x=>x.tog).map(x=>
        '<div class="fxTog on" data-v="'+x.val+'" role="switch" aria-checked="true"><span class="sw"></span>'+
        '<span class="tx"><b>'+x.code+' · +'+x.val+' %</b><i>'+x.title+'</i></span></div>').join('')+'</div>'+
      '<div class="fxCalcOut">'+
        '<div><i>База сценария</i><b id="fxCBase">—</b><span class="s2">чел/матч</span></div>'+
        '<div><i>Множитель факторов</i><b id="fxCProd">—</b><span class="s2">F3 × F4 × F5 × F7</span></div>'+
        '<div><i>Средний спрос</i><b id="fxCAvg">—</b><span class="s2">чел/матч</span></div>'+
        '<div><i>Вместимость при 60 %</i><b id="fxCCap">—</b><span class="s2">мест</span></div>'+
        '<div><i>Пики ×1,7–2,0</i><b id="fxCPeak">—</b><span class="s2">мест</span></div>'+
      '</div>'+
      '<div class="fxCalcNote">'+d.note+'</div></div>');
    let si=1;
    const pills=Array.from(pane.querySelectorAll('.fxSPill'));
    const togs=Array.from(pane.querySelectorAll('.fxTog'));
    const r100=x=>Math.round(x/100)*100;
    function recalc(){
      const sc=d.console.scen[si];
      let prod=1;
      togs.forEach(t=>{if(t.classList.contains('on'))prod*=1+(+t.dataset.v)/100});
      const avg=r100(r100(sc.base*prod)*(sc.boost||1)); /* порядок округления как в записке: сначала средняя РПЛ, потом рост лиги */
      const cap=avg/0.6, p1=avg*1.7, p2=avg*2.0;
      pane.querySelector('#fxCBase').textContent=nfmt(Math.round(sc.base*(sc.boost||1)));
      pane.querySelector('#fxCProd').textContent='× '+prod.toFixed(2);
      pane.querySelector('#fxCAvg').textContent='≈ '+nfmt(avg);
      pane.querySelector('#fxCCap').textContent='≈ '+nfmt(r100(cap));
      pane.querySelector('#fxCPeak').textContent=nfmt(r100(p1))+'–'+nfmt(r100(p2));
    }
    pills.forEach(p=>p.addEventListener('click',()=>{
      si=+p.dataset.i;pills.forEach(x=>x.classList.toggle('cur',x===p));recalc();
    }));
    togs.forEach(t=>t.addEventListener('click',()=>{
      t.classList.toggle('on');t.setAttribute('aria-checked',t.classList.contains('on'));recalc();
    }));
    recalc();
  }

    }
    const wA=y0+1.5*k,wB=y0+3*k;
    svg+='<rect x="70" y="'+wA+'" width="160" height="'+(wB-wA)+'" fill="rgba(95,168,199,.14)"/>'
      +'<text x="66" y="'+(wA+4)+'" text-anchor="end" font-family="var(--mono)" font-size="9" fill="var(--blue)">УГВ</text>';
    const fY=y0+2.4*k;
    svg+='<line x1="70" y1="'+fY+'" x2="230" y2="'+fY+'" stroke="var(--red)" stroke-width="1.2" stroke-dasharray="2 3"/>'
      +'<text x="66" y="'+(fY+13)+'" text-anchor="end" font-family="var(--mono)" font-size="9" fill="var(--red)">−2,4</text>';
    svg+='<line x1="70" y1="'+y0+'" x2="330" y2="'+y0+'" stroke="var(--mut)" stroke-width="1" stroke-dasharray="3 3"/>';
    svg+='<rect x="142" y="30" width="16" height="88" fill="rgba(224,188,69,.16)" stroke="var(--gold)" stroke-width="1"/>'
      +'<text x="150" y="22" text-anchor="middle" font-family="var(--mono)" font-size="9.5" fill="var(--gold2)">ПИЛОН</text>';
    const rT=y0+0.9*k, rB=y0+2.7*k;
    svg+='<rect x="105" y="'+rT+'" width="90" height="'+(rB-rT)+'" fill="rgba(201,162,39,.20)" stroke="var(--gold)" stroke-width="1.2"/>'
      +'<text x="237" y="'+(rT+2)+'" font-family="var(--mono)" font-size="9" fill="var(--gold2)">ростверк</text>'
      +'<text x="237" y="'+(rT+14)+'" font-family="var(--mono)" font-size="9" fill="var(--paper)">6,0×6,0×1,8 м</text>'
      +'<text x="237" y="'+(rT+26)+'" font-family="var(--mono)" font-size="9" fill="var(--mut)">−2,7 м</text>';
    svg+='<rect id="fxPile" x="142.5" y="'+rB+'" width="15" height="270" fill="rgba(201,162,39,.28)" stroke="var(--gold2)" stroke-width="1.4"/>';
    svg+='<path id="fxTip" d="M150,'+(rB+270)+' m-9,0 l9,12 l9,-12 z" fill="var(--gold2)"/>';
    svg+='<text id="fxTipT" x="166" y="'+(rB+282)+'" font-family="var(--mono)" font-size="9.5" fill="var(--gold2)">остриё −20,7 м</text>';
    svg+='<text x="70" y="590" font-family="var(--mono)" font-size="9" fill="var(--mut)">разрез схематичен · слои по принятому разрезу ИГЭ-1–4</text>';
    svg+='</svg>';
    const pills=d.variants.map((v,i)=>'<button class="fxSPill'+(i===2?' cur':'')+'" data-i="'+i+'">Ø1000 × '+v.label+'</button>').join('');
    pane.insertAdjacentHTML('beforeend','<div class="fxPc"><div class="fxPcSvg">'+svg+'</div>'
      +'<div class="fxPcPanel"><div class="fxPcForm"><b>'+d.formula+'</b><br>'+d.params+'</div>'
      +'<div class="fxSPills">'+pills+'</div>'
      +'<div class="fxPcNums">'
      +'<div><i>Трение по боковой</i><b id="fxPcF">—</b></div>'
      +'<div><i>Остриё</i><b id="fxPcE">—</b></div>'
      +'<div><i>Fd</i><b id="fxPcFd" class="g">—</b></div>'
      +'<div><i>Допустимая N ≤ Fd/1,4</i><b id="fxPcN" class="g">—</b></div></div>'
      +'<div class="fxBarLb"><span>Fd = трение + остриё</span><b id="fxPcFdT"></b></div>'
      +'<div class="fxBar" id="fxBarFd"><div class="seg segF" id="fxSegF"></div><div class="seg segE" id="fxSegE"></div><div class="req" style="left:'+(d.reqFd/14*100)+'%"><span class="reqT">требуется 2,52 МН</span></div></div>'
      +'<div class="fxBarLb"><span>допустимая нагрузка на сваю</span><b id="fxPcNT"></b></div>'
      +'<div class="fxBar"><div class="seg segE" id="fxSegN"></div><div class="req" style="left:'+(d.reqN/10*100)+'%"><span class="reqT">N = 1,8 МН</span></div></div>'
      +'<div class="fxVd vdGood" id="fxPcVd"></div>'
      +'</div></div>');
    pane.insertAdjacentHTML('beforeend','<div class="fxKey">'+d.key+'</div>');
    const mn=x=>x.toLocaleString('ru-RU',{minimumFractionDigits:2,maximumFractionDigits:2});
    function apply(i){
      const v=d.variants[i];
      pane.querySelectorAll('.fxSPill').forEach((p,j)=>p.classList.toggle('cur',j===i));
      pane.querySelector('#fxPcF').textContent=v.friction?mn(v.friction)+' МН':'—';
      pane.querySelector('#fxPcE').textContent=mn(v.end)+' МН'+(v.id==='l25'?' (по материалу)':'');
      pane.querySelector('#fxPcFd').textContent=mn(v.fd)+' МН';
      pane.querySelector('#fxPcN').textContent=mn(v.allow)+' МН';
      pane.querySelector('#fxPcFdT').textContent='Fd = '+mn(v.fd)+' МН';
      const aN=v.fd/1.4; /* запас считаем от неокруглённой допустимой, как в записке */
      let zTxt;
      if(aN<d.reqN)zTxt='дефицит '+Math.round((d.reqN/aN-1)*100)+' %';
      else if(aN/d.reqN>=3)zTxt='кратный запас (×'+(aN/d.reqN).toFixed(1).replace('.',',')+')';
      else zTxt='запас '+Math.round((aN/d.reqN-1)*100)+' %';
      pane.querySelector('#fxPcNT').textContent=mn(v.allow)+' МН · '+zTxt;
      const pile=pane.querySelector('#fxPile');
      pile.setAttribute('height',Math.max(0,(v.tip-2.7)*k));
      const tip=pane.querySelector('#fxTip');
      tip.setAttribute('d','M150,'+(rB+(v.tip-2.7)*k)+' m-9,0 l9,12 l9,-12 z');
      const tt=pane.querySelector('#fxTipT');
      tt.setAttribute('y',rB+(v.tip-2.7)*k+12); tt.textContent='остриё −'+v.tip.toLocaleString('ru-RU')+' м';
      const vd=pane.querySelector('#fxPcVd');
      vd.className='fxVd '+(v.verdict==='bad'?'vdBad':v.verdict==='mid'?'vdMid':v.verdict==='good'?'vdGood':'vdRock');
      vd.innerHTML=v.verdictT+'<small>'+v.note+'</small>';
      requestAnimationFrame(()=>requestAnimationFrame(()=>{
        pane.querySelector('#fxSegF').style.width=(v.friction/14*100)+'%';
        pane.querySelector('#fxSegE').style.left=(v.friction/14*100)+'%';
        pane.querySelector('#fxSegE').style.width=(v.end/14*100)+'%';
        pane.querySelector('#fxSegN').style.width=(v.allow/10*100)+'%';
      }));
    }
    pane.querySelectorAll('.fxSPill').forEach(p=>p.addEventListener('click',()=>apply(+p.dataset.i)));
    apply(2);
  }

  function rChecks(pane,f){
    paneHead(pane,'04 / Вторая группа и особые условия','Поверочные проверки','Восемь проверок основания и конструкции: что уже обеспечено, что уточняется на стадии П.');
    pane.insertAdjacentHTML('beforeend','<div class="fxChkGrid">'+f.checks.map(c=>
      '<div class="fxChk"><span class="res '+(c.cls==='ok'?'resOk':'resStage')+'">'+c.res+'</span>'
      +'<div class="nm">'+c.name+'</div><div class="vl">'+c.val+'</div><div class="ds">'+c.desc+'</div></div>'
    ).join('')+'</div>');
  }

  function rFoundation(pane,f){
    const d=f.design;
    paneHead(pane,'05 / Конструктив','Принятый куст: ростверк + 8 свай Ø1000 × 18 м','Параметры для модели и задания на проектирование.');
    let s1='<svg viewBox="0 0 380 440">';
    s1+='<rect x="168" y="18" width="44" height="113.5" fill="rgba(224,188,69,.14)" stroke="var(--gold)" stroke-width="1"/>'
      +'<text x="190" y="12" text-anchor="middle" font-family="var(--mono)" font-size="9.5" fill="var(--gold2)">ПИЛОН</text>';
    s1+='<line x1="20" y1="118" x2="360" y2="118" stroke="var(--mut)" stroke-width="1" stroke-dasharray="3 3"/>'
      +'<text x="360" y="112" text-anchor="end" font-family="var(--mono)" font-size="9" fill="var(--mut)">поверхность · 0,000</text>';
    s1+='<rect x="115" y="131.5" width="150" height="27" fill="rgba(201,162,39,.20)" stroke="var(--gold)" stroke-width="1.4"/>'
      +'<text x="271" y="141" font-family="var(--mono)" font-size="9.5" fill="var(--gold2)">ростверк</text>'
      +'<text x="271" y="153" font-family="var(--mono)" font-size="9" fill="var(--paper)">6,0 × 6,0 × 1,8 м</text>'
      +'<text x="271" y="165" font-family="var(--mono)" font-size="9" fill="var(--mut)">подошва −2,7 м</text>'
      +'<text x="271" y="177" font-family="var(--mono)" font-size="9" fill="var(--mut)">B30 · W8 · F200</text>';
    s1+='<line x1="30" y1="131.5" x2="100" y2="131.5" stroke="var(--red)" stroke-width="1.2" stroke-dasharray="2 3"/>'
      +'<text x="30" y="126" font-family="var(--mono)" font-size="9" fill="var(--red)">−0,9</text>';
    [145,190,235].forEach(px=>{
      s1+='<rect x="'+(px-7.5)+'" y="158.5" width="15" height="210" fill="rgba(201,162,39,.24)" stroke="var(--gold2)" stroke-width="1.2"/>'
        +'<path d="M'+px+',368.5 m-7,0 l7,9 l7,-9 z" fill="var(--gold2)"/>';
    });
    s1+='<text x="190" y="400" text-anchor="middle" font-family="var(--mono)" font-size="9.5" fill="var(--paper)">сваи Ø1000 · L = 18 м · шаг 3,0 м в осях</text>'
      +'<text x="190" y="416" text-anchor="middle" font-family="var(--mono)" font-size="9" fill="var(--mut)">длина свай показана в сжатом масштабе</text>';
    s1+='</svg>';
    let s2='<svg viewBox="0 0 300 330">';
    s2+='<rect x="60" y="55" width="180" height="180" fill="rgba(201,162,39,.08)" stroke="var(--gold)" stroke-width="1.4"/>'
      +'<text x="150" y="30" text-anchor="middle" font-family="var(--mono)" font-size="9.5" fill="var(--gold2)">ростверк 6,0 × 6,0 м</text>';
    [[0,0],[1,0],[2,0],[0,1],[2,1],[0,2],[1,2],[2,2]].forEach(g=>{
      s2+='<circle cx="'+(60+g[0]*90)+'" cy="'+(55+g[1]*90)+'" r="15" fill="rgba(95,168,199,.20)" stroke="var(--blue)" stroke-width="1.2"/>';
    });
    s2+='<rect x="135" y="130" width="30" height="30" fill="none" stroke="var(--gold2)" stroke-width="1.2" stroke-dasharray="4 3"/>'
      +'<text x="150" y="176" text-anchor="middle" font-family="var(--mono)" font-size="8.5" fill="var(--gold2)">пята пилона</text>';
    s2+='<line x1="60" y1="263" x2="150" y2="263" stroke="var(--mut)" stroke-width="1"/>'
      +'<line x1="60" y1="259" x2="60" y2="267" stroke="var(--mut)" stroke-width="1"/>'
      +'<line x1="150" y1="259" x2="150" y2="267" stroke="var(--mut)" stroke-width="1"/>'
      +'<text x="105" y="258" text-anchor="middle" font-family="var(--mono)" font-size="9" fill="var(--mut)">3,0 м</text>';
    s2+='<line x1="150" y1="263" x2="240" y2="263" stroke="var(--mut)" stroke-width="1"/>'
      +'<line x1="240" y1="259" x2="240" y2="267" stroke="var(--mut)" stroke-width="1"/>'
      +'<text x="195" y="258" text-anchor="middle" font-family="var(--mono)" font-size="9" fill="var(--mut)">3,0 м</text>';
    s2+='<text x="150" y="300" text-anchor="middle" font-family="var(--mono)" font-size="9.5" fill="var(--paper)">куст 8 свай: сетка 3 × 3 − 1</text>'
      +'<text x="150" y="316" text-anchor="middle" font-family="var(--mono)" font-size="9" fill="var(--mut)">4 пилона × 8 = 32 сваи</text>';
    s2+='</svg>';
    pane.insertAdjacentHTML('beforeend','<div class="fxFg"><div class="box"><h5>Разрез куста (схема)</h5>'+s1+'</div><div class="box"><h5>План куста (схема)</h5>'+s2+'</div></div>');
    pane.insertAdjacentHTML('beforeend','<div class="fxSpecs">'+d.specs.map(sp=>
      '<div class="fxSpec"><h5>'+sp.t+'</h5><table>'+sp.rows.map(r=>'<tr><td>'+r[0]+'</td><td>'+r[1]+'</td></tr>').join('')+'</table></div>'
    ).join('')+'</div>');
    pane.insertAdjacentHTML('beforeend','<div class="fxBim">'+d.bim+'</div>');
  }

  function rTech(pane,f){
    const d=f.tech;
    paneHead(pane,'06 / Реализация','Технология, контроль и испытания','Порядок работ: от обязательных изысканий до статических испытаний свай.');
    pane.insertAdjacentHTML('beforeend','<div class="fxSteps">'+d.steps.map((s,i)=>
      '<div class="fxStep"><span class="n">'+String(i+1).padStart(2,'0')+'</span><div><h5>'+s[0]
      +'<span class="fxBadge '+s[2]+'">'+s[3]+'</span></h5><p>'+s[1]+'</p></div></div>'
    ).join('')+'</div>');
  }

  renderAll();
})();
</script>
<script src="modules.js"></script>
