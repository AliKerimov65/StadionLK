<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Конструктивно-технические особенности · Стадион ЛК</title>
<link rel="stylesheet" href="modules.css">
<style>
:root{
  --navy:#131b30; --navy2:#0d1424; --panel:#111a2e; --gold:#c9a227; --gold2:#e0bc45;
  --paper:#e8e6df; --mut:#9aa3b8; --faint:#69707a; --line:rgba(255,255,255,.08);
  --blue:#5fa8c7; --amber:#d9a24a; --red:#c23b2a; --green:#7fb685;
  --mono:'PT Mono',ui-monospace,'Cascadia Mono',Menlo,Consolas,monospace;
}
html{scroll-behavior:smooth}
body{background:var(--navy2);color:var(--paper);font-family:'Inter',system-ui,sans-serif;line-height:1.6;margin:0}
h1,h2,h3{font-family:'Playfair Display','PT Serif',Georgia,serif;font-weight:600}
a{color:var(--gold2);text-decoration:none}
.mono{font-family:var(--mono);letter-spacing:.02em}

/* ---------- каркас ---------- */
.fxRail{position:fixed;top:0;left:0;bottom:0;width:284px;border-right:1px solid var(--line);
  background:var(--navy2);display:flex;flex-direction:column;z-index:40}
.fxBrand{padding:80px 20px 14px;border-bottom:1px solid var(--line)}
.fxBrand b{display:block;font-family:var(--mono);font-size:11px;letter-spacing:.18em;color:var(--gold2);text-transform:uppercase}
.fxBrand span{display:block;margin-top:6px;font-size:12px;color:var(--mut)}
.fxList{flex:1;overflow-y:auto;padding:10px 12px}
.fxItem{display:block;width:100%;text-align:left;background:none;border:0;border-left:2px solid transparent;
  padding:12px 12px 12px 14px;color:var(--paper);cursor:pointer;border-radius:0 8px 8px 0}
.fxItem .n{font-family:var(--mono);font-size:11px;color:var(--gold2);display:block;margin-bottom:3px}
.fxItem .t{display:block;font-size:14.5px;font-weight:600;line-height:1.35}
.fxItem .s{display:block;font-size:11.5px;color:var(--mut);margin-top:3px;line-height:1.4}
.fxItem:hover{background:rgba(255,255,255,.04)}
.fxItem.cur{border-left-color:var(--gold);background:rgba(201,162,39,.08)}
.fxItem.dis{opacity:.42;cursor:default}
.fxItem.dis:hover{background:none}
.fxBack{padding:14px 20px;border-top:1px solid var(--line);display:flex;gap:16px;font-size:12.5px}
.fxBack a{color:var(--mut)}
.fxBack a:hover{color:var(--gold2)}
.fxMain{margin-left:284px;min-height:100vh;padding:0 34px 120px;max-width:1180px}

/* ---------- шапка особенности ---------- */
.fxHead{padding:42px 0 8px}
.fxKick{font-family:var(--mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--gold2)}
.fxHead h1{font-size:clamp(22px,2.6vw,32px);line-height:1.2;margin:10px 0 8px;max-width:30ch}
.fxHead .sub{color:var(--mut);max-width:70ch;font-size:15px}
.fxMeta{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px;align-items:center}
.fxStatus{font-family:var(--mono);font-size:11px;padding:4px 10px;border:1px solid var(--amber);color:var(--amber);border-radius:99px}
.fxDate{font-family:var(--mono);font-size:11px;color:var(--faint);padding:4px 2px}
.fxChips{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:1px;background:var(--line);
  border:1px solid var(--line);margin:22px 0 6px}
.fxChips div{background:var(--navy2);padding:12px 14px}
.fxChips i{display:block;font-style:normal;font-family:var(--mono);font-size:10.5px;color:var(--faint);text-transform:uppercase;letter-spacing:.08em}
.fxChips b{display:block;font-family:var(--mono);font-size:15px;color:var(--paper);margin-top:4px;font-weight:600}

/* ---------- вкладки ---------- */
.fxTabs{position:sticky;top:0;z-index:30;background:var(--navy2);border-bottom:1px solid var(--line);
  display:flex;gap:2px;overflow-x:auto;padding:10px 0 0;scrollbar-width:none}
.fxTabs::-webkit-scrollbar{display:none}
.fxTab{flex:0 0 auto;background:none;border:0;border-bottom:2px solid transparent;color:var(--mut);
  font-family:var(--mono);font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;
  padding:9px 13px 11px;cursor:pointer;white-space:nowrap}
.fxTab .dot{display:inline-block;width:6px;height:6px;border-radius:99px;background:var(--faint);margin-right:7px;vertical-align:1px}
.fxTab.cur{color:var(--gold2);border-bottom-color:var(--gold)}
.fxTab.cur .dot{background:var(--gold2);animation:fxPulse 2.2s infinite}
@keyframes fxPulse{0%,100%{box-shadow:0 0 0 0 rgba(224,188,69,.5)}50%{box-shadow:0 0 0 5px rgba(224,188,69,0)}}
.fxPane{padding:26px 0 10px;animation:fxIn .45s cubic-bezier(.22,1,.36,1)}
@keyframes fxIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.fxPane h2{font-size:clamp(19px,2.2vw,25px);margin:0 0 6px;max-width:46ch}
.fxPane .lead{color:var(--mut);font-size:14.5px;max-width:78ch}
.fxNum{font-family:var(--mono);font-size:11px;letter-spacing:.16em;color:var(--faint);text-transform:uppercase;display:block;margin-bottom:8px}

/* ---------- карточки ---------- */
.fxCards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);margin-top:18px}
.fxCards .c{background:var(--navy2);padding:14px 16px}
.fxCards .k{font-size:12.5px;color:var(--mut);line-height:1.45}
.fxCards .v{display:block;font-family:var(--mono);font-size:15.5px;margin-top:6px;color:var(--paper)}
.fxCards .src{display:inline-block;margin-top:8px;font-family:var(--mono);font-size:10px;color:var(--blue);
  border:1px solid rgba(95,168,199,.35);padding:2px 7px;border-radius:99px}
.fxFoot{margin-top:14px;font-size:13px;color:var(--mut);border-left:2px solid var(--gold);padding:8px 14px;max-width:80ch}

/* ---------- схема-план ---------- */
.fxPlan{border:1px solid var(--line);background:var(--panel);padding:14px;margin-top:16px}
.fxPlan svg{width:100%;height:auto;display:block}
.fxNote{font-family:var(--mono);font-size:10.5px;color:var(--faint);margin-top:10px}
.fxParams{margin-top:18px;display:grid;grid-template-columns:repeat(auto-fill,minmax(255px,1fr));gap:1px;background:var(--line);border:1px solid var(--line)}
.fxParams div{background:var(--navy2);padding:13px 15px}
.fxParams b{display:block;font-size:13px;color:var(--gold2);font-family:var(--mono);font-weight:600}
.fxParams i{display:block;font-style:normal;font-size:12px;color:var(--mut);margin-top:4px;line-height:1.45}

/* ---------- тепловой расчёт ---------- */
.fxHeat{border:1px solid var(--line);background:var(--panel);padding:20px;margin-top:16px}
.fxHeatTop{display:flex;flex-wrap:wrap;gap:22px;align-items:flex-end;justify-content:space-between}
.fxSlider{flex:1 1 300px}
.fxSlider input{width:100%;accent-color:var(--gold2)}
.fxSlider .lab{font-family:var(--mono);font-size:11px;color:var(--mut);display:flex;justify-content:space-between}
.fxBig{text-align:right}
.fxBig .mw{font-family:var(--mono);font-size:clamp(26px,3.4vw,38px);color:var(--gold2);line-height:1.05}
.fxBig .gc{font-family:var(--mono);font-size:12px;color:var(--mut);margin-top:4px}
.fxBars{margin-top:20px;display:grid;gap:12px}
.fxBar .bl{display:flex;justify-content:space-between;font-family:var(--mono);font-size:11px;color:var(--mut);margin-bottom:4px}
.fxBar .track{height:14px;background:rgba(255,255,255,.05);position:relative}
.fxBar .fill{position:absolute;top:0;bottom:0;left:0;background:linear-gradient(90deg,rgba(201,162,39,.55),var(--gold2));
  transition:width .35s cubic-bezier(.22,1,.36,1)}
.fxBar .band{position:absolute;top:0;bottom:0;background:rgba(95,168,199,.30);border-left:1px solid var(--blue);border-right:1px solid var(--blue);transition:all .35s}
.fxHeat details{margin-top:16px}
.fxHeat summary{cursor:pointer;font-family:var(--mono);font-size:11.5px;color:var(--blue);text-transform:uppercase;letter-spacing:.08em}
.fxHeat .asm{margin-top:10px;font-size:12.5px;color:var(--mut);max-width:78ch}

/* ---------- снеговые мешки ---------- */
.fxMeshki{display:grid;grid-template-columns:1.25fr .95fr;gap:20px;margin-top:16px;align-items:start}
.fxScheme{border:1px solid var(--line);background:var(--panel);padding:12px;position:sticky;top:56px}
.fxScheme svg{width:100%;height:auto;display:block}
.fxVars{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:14px}
.fxVar{border:1px solid var(--line);background:none;color:var(--mut);border-radius:99px;padding:7px 13px;
  font-family:var(--mono);font-size:11px;cursor:pointer;letter-spacing:.03em}
.fxVar .dot{display:inline-block;width:6px;height:6px;border-radius:99px;background:var(--faint);margin-right:6px;vertical-align:1px}
.fxVar:hover{border-color:var(--gold);color:var(--paper)}
.fxVar.cur{border-color:var(--gold2);color:var(--gold2);background:rgba(201,162,39,.08)}
.fxVar.cur .dot{background:var(--gold2);animation:fxPulse 2.2s infinite}
.fxVPanel{border:1px solid var(--line);background:var(--panel);padding:18px 18px 16px;animation:fxIn .4s cubic-bezier(.22,1,.36,1)}
.fxVPanel h3{margin:0 0 2px;font-size:17px;line-height:1.3}
.fxVStatus{display:inline-block;font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;
  padding:3px 9px;border-radius:99px;margin:6px 0 10px}
.stPractice{border:1px solid rgba(95,168,199,.5);color:var(--blue)}
.stNorm{border:1px solid rgba(127,182,133,.5);color:var(--green)}
.stProject{border:1px solid rgba(224,188,69,.55);color:var(--gold2)}
.fxVPanel p{font-size:13.5px;color:var(--paper);margin:8px 0}
.fxVPanel .k{color:var(--mut)}
.fxVPanel .k b{color:var(--gold2);font-weight:600}
.fxVPanel .src{font-family:var(--mono);font-size:10.5px;color:var(--faint);border-top:1px dashed var(--line);padding-top:9px;margin-top:12px}

/* ---------- таймлайн аварий ---------- */
.fxTime{margin-top:18px;border-left:1px solid var(--line);padding-left:0}
.fxEv{display:grid;grid-template-columns:86px 1fr;gap:16px;padding:16px 0 16px 18px;border-bottom:1px solid var(--line);position:relative}
.fxEv::before{content:'';position:absolute;left:-4.5px;top:24px;width:8px;height:8px;border-radius:99px;background:var(--red)}
.fxEv .y{font-family:var(--mono);font-size:22px;color:var(--red);line-height:1.1}
.fxEv h3{margin:0 0 6px;font-size:16.5px}
.fxEv p{margin:0 0 8px;font-size:13.5px;color:var(--mut)}
.fxEv .les{font-size:13px;color:var(--paper);border-left:2px solid var(--gold);padding-left:12px}
.fxEv .les b{color:var(--gold2);font-family:var(--mono);font-size:10.5px;text-transform:uppercase;letter-spacing:.1em;display:block;margin-bottom:3px}

/* ---------- чек-листы ---------- */
.fxGroups{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:18px;margin-top:18px}
.fxGroup{border:1px solid var(--line);background:var(--panel);padding:18px}
.fxGroup h3{margin:0 0 12px;font-size:16px}
.fxGroup ul{list-style:none;margin:0;padding:0}
.fxGroup li{font-size:13px;color:var(--mut);padding:9px 0 9px 24px;border-top:1px solid var(--line);position:relative;line-height:1.5}
.fxGroup li::before{content:'';position:absolute;left:2px;top:15px;width:9px;height:9px;border:1px solid var(--gold2);transform:rotate(45deg)}

/* ---------- выводы ---------- */
.fxConcl{counter-reset:cx;margin-top:18px}
.fxConcl li{list-style:none;counter-increment:cx;position:relative;padding:14px 0 14px 56px;border-bottom:1px solid var(--line);
  font-size:14.5px;max-width:82ch}
.fxConcl li::before{content:counter(cx,decimal-leading-zero);position:absolute;left:0;top:14px;
  font-family:var(--mono);font-size:13px;color:var(--gold2)}
.fxSrc{margin-top:22px}
.fxSrc summary{cursor:pointer;font-family:var(--mono);font-size:11.5px;color:var(--blue);text-transform:uppercase;letter-spacing:.08em}
.fxSrc ol{margin:12px 0 0;padding-left:20px}
.fxSrc li{font-size:12.5px;color:var(--mut);margin-bottom:7px}

/* ---------- мобильная адаптация ---------- */
@media(max-width:960px){
  .fxRail{position:static;width:auto;border-right:0;border-bottom:1px solid var(--line)}
  .fxList{display:flex;overflow-x:auto;gap:6px;padding:10px}
  .fxItem{flex:0 0 220px;border:1px solid var(--line);border-radius:10px;border-left-width:1px}
  .fxItem.cur{border-color:var(--gold)}
  .fxBack{justify-content:center}
  .fxMain{margin-left:0;padding:0 16px 90px}
  .fxMeshki{grid-template-columns:1fr}
  .fxScheme{position:static}
  .fxBig{text-align:left}
  .fxEv{grid-template-columns:56px 1fr;gap:10px}
}
@media print{.fxRail,.fxTabs,.fxVars{display:none}.fxMain{margin:0}}
</style>
</head>
<body>

<aside class="fxRail">
  <div class="fxBrand"><b>Стадион ЛК · КТО</b><span>Конструктивно-технические особенности · интерактивные разборы</span></div>
  <div class="fxList" id="fxList"></div>
  <div class="fxBack"><a href="index.html">← К модулям проекта</a><a href="#" id="fxClose">Закрыть окно ✕</a></div>
</aside>

<main class="fxMain" id="fxMain"></main>

<script src="features-data.js"></script>
<script>
(function(){
  const qp=new URLSearchParams(location.search);
  let curId=qp.get('f')||FEATURES[0].id;

  /* ---------- рейка особенностей ---------- */
  const list=document.getElementById('fxList');
  FEATURES.forEach(f=>{
    const b=document.createElement('button');
    b.className='fxItem'+(f.id===curId?' cur':'')+(f.placeholder?' dis':'');
    b.innerHTML='<span class="n">ОСОБЕННОСТЬ '+f.num+'</span><span class="t">'+f.title+'</span>'+
                '<span class="s">'+(f.placeholder?f.subtitle:'открыть разбор')+'</span>';
    if(!f.placeholder)b.addEventListener('click',()=>{curId=f.id;history.replaceState(null,'','?f='+f.id);renderAll();});
    list.appendChild(b);
  });
  document.getElementById('fxClose').addEventListener('click',e=>{e.preventDefault();window.close();});

  function renderAll(){
    list.querySelectorAll('.fxItem').forEach((b,i)=>b.classList.toggle('cur',FEATURES[i].id===curId));
    const f=FEATURES.find(x=>x.id===curId)||FEATURES[0];
    if(f.placeholder)return;
    renderFeature(f);
  }

  /* ---------- шапка + вкладки ---------- */
  function renderFeature(f){
    const main=document.getElementById('fxMain');
    main.innerHTML=
      '<header class="fxHead">'+
        '<span class="fxKick">Особенность '+f.num+' · Конструктивно-технический разбор</span>'+
        '<h1>'+f.title+'</h1>'+
        '<div class="sub">'+f.subtitle+'</div>'+
        '<div class="fxMeta"><span class="fxStatus">'+f.status+'</span><span class="fxDate">'+f.date+'</span></div>'+
        '<div class="fxChips">'+f.chips.map(c=>'<div><i>'+c[0]+'</i><b>'+c[1]+'</b></div>').join('')+'</div>'+
      '</header>'+
      '<nav class="fxTabs" id="fxTabs"></nav>'+
      '<section class="fxPane" id="fxPane"></section>';
    const tabs=document.getElementById('fxTabs');
    f.tabs.forEach((t,i)=>{
      const b=document.createElement('button');
      b.className='fxTab'+(i===0?' cur':'');
      b.innerHTML='<span class="dot"></span>'+t.label;
      b.addEventListener('click',()=>{
        tabs.querySelectorAll('.fxTab').forEach(x=>x.classList.remove('cur'));
        b.classList.add('cur');renderTab(f,t);
      });
      tabs.appendChild(b);
    });
    renderTab(f,f.tabs[0]);
    window.scrollTo({top:0});
  }

  function renderTab(f,t){
    const pane=document.getElementById('fxPane');
    const R={plan:rPlan,cards:rCards,heat:rHeat,meshki:rMeshki,timeline:rTimeline,checklist:rChecklist,conclusions:rConclusions};
    pane.innerHTML='';
    R[t.type](pane,f);
  }

  function paneHead(pane,num,title,lead){
    pane.innerHTML='<span class="fxNum">'+num+'</span><h2>'+title+'</h2>'+(lead?'<p class="lead">'+lead+'</p>':'');
  }

  /* ---------- 01 · схема-план проёма ---------- */
  function rPlan(pane,f){
    paneHead(pane,'01 / Геометрия','Схема проёма и параметры концепции',f.plan.note);
    const W=800,H=520,x0=90,x1=750,y0=40,y1=452;      // 109 м → x, 68 м → y
    const sw=(x1-x0)/17;
    let strips='';
    for(let i=0;i<17;i++){
      const x=x0+i*sw, odd=(i+1)%2===1, hl=(i===8);
      strips+='<g class="strip" data-t="Полоса №'+(i+1)+' · ширина 6,41 м · пролёт 68 м · выдвижение '+(odd?'с юга':'с севера')+'">'
        +'<rect x="'+x.toFixed(1)+'" y="'+y0+'" width="'+sw.toFixed(1)+'" height="'+(y1-y0)+'" fill="'+(hl?'rgba(201,162,39,.30)':(i%2?'rgba(255,255,255,.05)':'rgba(95,168,199,.10)'))+'" stroke="rgba(255,255,255,.14)" stroke-width="1"/>'
        +'<path d="M'+(x+sw/2).toFixed(1)+' '+(odd?(y1-26):(y0+26))+' v '+(odd?-(y1-y0-52):(y1-y0-52))+'" stroke="'+(hl?'#e0bc45':'rgba(255,255,255,.35)')+'" stroke-width="1.4" marker-end="url(#fxArr)"/>'
        +'<text x="'+(x+sw/2).toFixed(1)+'" y="'+(y0+16)+'" fill="'+(hl?'#e0bc45':'rgba(255,255,255,.4)')+'" font-size="10" font-family="var(--mono)" text-anchor="middle">'+(i+1)+'</text></g>';
    }
    const svg='<svg viewBox="0 0 '+W+' '+H+'">'
      +'<defs><marker id="fxArr" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 z" fill="rgba(224,188,69,.9)"/></marker></defs>'
      +'<rect x="'+(x0-6)+'" y="'+(y0-16)+'" width="'+(x1-x0+12)+'" height="16" fill="rgba(201,162,39,.12)"/>'
      +'<rect x="'+(x0-6)+'" y="'+y1+'" width="'+(x1-x0+12)+'" height="16" fill="rgba(201,162,39,.12)"/>'
      +'<text x="'+((x0+x1)/2)+'" y="'+(y0-4)+'" fill="#c9a227" font-size="11" font-family="var(--mono)" text-anchor="middle">КАССЕТЫ · Y = +34 (чётные полосы, с севера)</text>'
      +'<text x="'+((x0+x1)/2)+'" y="'+(y1+13)+'" fill="#c9a227" font-size="11" font-family="var(--mono)" text-anchor="middle">КАССЕТЫ · Y = −34 (нечётные полосы, с юга)</text>'
      +strips
      +'<text x="'+((x0+x1)/2)+'" y="'+(y1+40)+'" fill="#9aa3b8" font-size="12" font-family="var(--mono)" text-anchor="middle">109 м · ось X от −42 до +67</text>'
      +'<text x="'+(x1+14)+'" y="'+((y0+y1)/2)+'" fill="#9aa3b8" font-size="12" font-family="var(--mono)" transform="rotate(90 '+(x1+14)+' '+((y0+y1)/2)+')" text-anchor="middle">68 м · |Y| ≤ 34</text>'
      +'<text x="'+(x0+8*sw+sw/2)+'" y="'+(y1+40)+'" fill="#e0bc45" font-size="0" font-family="var(--mono)"></text>'
      +'</svg>';
    pane.insertAdjacentHTML('beforeend','<div class="fxPlan">'+svg+
      '<div class="fxNote">СХЕМА В ПЛАНЕ · ПОЛОСА № 9 (ЗОЛОТО) ЛЕЖИТ НА ОСИ ПОЛЯ X = 12,5 М · СТРЕЛКИ — НАПРАВЛЕНИЕ ВЫДВИЖЕНИЯ</div></div>');
    pane.insertAdjacentHTML('beforeend','<div class="fxParams">'+f.plan.params.map(prm=>
      '<div><b>'+prm[0]+' · '+prm[1]+'</b><i>'+prm[2]+'</i></div>').join('')+'</div>');
    pane.querySelectorAll('.strip').forEach(g=>{
      g.addEventListener('pointerenter',()=>{g.querySelector('rect').setAttribute('stroke','#e0bc45')});
      g.addEventListener('pointerleave',()=>{g.querySelector('rect').setAttribute('stroke','rgba(255,255,255,.14)')});
    });
  }

  /* ---------- 02 · климат и нагрузки ---------- */
  function rCards(pane,f){
    paneHead(pane,'02 / Нормативная рамка','Климат Красноярска и нагрузки','Все значения верифицированы по действующим редакциям сводов правил; источник указан на каждой карточке.');
    pane.insertAdjacentHTML('beforeend','<div class="fxCards">'+f.climate.cards.map(c=>
      '<div class="c"><span class="k">'+c.k+'</span><span class="v">'+c.v+'</span><span class="src">'+c.src+'</span></div>').join('')+'</div>');
    pane.insertAdjacentHTML('beforeend','<div class="fxFoot">'+f.climate.foot+'</div>');
  }

  /* ---------- 03 · сценарий +10 °C ---------- */
  function rHeat(pane,f){
    paneHead(pane,'03 / Энергетика','Сценарий «зимой в чаше +10 °C»',
      'Оценка порядка величин при полностью закрытой чаше. Двигайте ползунок наружной температуры — потери пересчитываются. Допущения — под кнопкой ниже.');
    pane.insertAdjacentHTML('beforeend',
      '<div class="fxHeat">'+
        '<div class="fxHeatTop">'+
          '<div class="fxSlider"><div class="lab"><span>−41 °C (холодные сутки 0,98)</span><span>0 °C</span></div>'+
          '<input type="range" id="fxT" min="-41" max="0" step="1" value="-23">'+
          '<div class="lab"><span>Сейчас снаружи: <b id="fxTv" style="color:#e0bc45">−23 °C (обеспеченность 0,94)</b></span><span>В чаше: +10 °C</span></div></div>'+
          '<div class="fxBig"><div class="mw" id="fxMw">—</div><div class="gc" id="fxGc">—</div></div>'+
        '</div>'+
        '<div class="fxBars">'+
          '<div class="fxBar"><div class="bl"><span>ПРОЁМ · ПОДУШКИ 7 400 М² (U=1,8)</span><span id="fxB1v"></span></div><div class="track"><div class="fill" id="fxB1"></div></div></div>'+
          '<div class="fxBar"><div class="bl"><span>СТАЦИОНАРНАЯ ЧАСТЬ ≈ 26 600 М² (U=2,0…5,6)</span><span id="fxB2v"></span></div><div class="track"><div class="band" id="fxB2"></div></div></div>'+
          '<div class="fxBar"><div class="bl"><span>ИНФИЛЬТРАЦИЯ 0,3 ОБ/Ч (≈ 500 ТЫС. М³)</span><span id="fxB3v"></span></div><div class="track"><div class="fill" id="fxB3" style="background:linear-gradient(90deg,rgba(95,168,199,.45),#5fa8c7)"></div></div></div>'+
        '</div>'+
        '<details><summary>Допущения и база расчёта</summary><div class="asm">'+
          'Пятно покрытия 200×170 м ≈ 34 000 м² (по габаритам модели); проём 68×109 м ≈ 7 400 м² — трёхслойные подушки U ≈ 1,8 Вт/(м²·К); '+
          'стационарная часть ≈ 26 600 м² в двух крайних исполнениях: подушки (U = 2,0) и однослойная мембрана (U = 5,6). '+
          'Воздушный объём чаши ≈ 500 тыс. м³; инфильтрация 0,3 об/ч; ρ = 1,2 кг/м³; c = 1,005 кДж/(кг·К). '+
          'Солнечные поступления и тепловыделения людей не учитывались (запас). 1 МВт = 0,8598 Гкал/ч. '+
          'Каталожные U подушек: 2 слоя ≈ 2,9; 3 слоя ≈ 1,8–2,0; 4 слоя ≈ 1,4–1,6 Вт/(м²·К).'+
        '</div></details>'+
      '</div>'+
      '<div class="fxFoot">Вывод: +10 °C во всём объёме чаши — 4…7 МВт при −23 °C и 6…10 МВт при −39 °C. '+
      'Базовый зимний режим: фон +2…+5 °C, локальный инфракрасный обогрев зрительских мест, подогрев поля; '+
      '+10 °C — кратковременный мероприятийный режим или локальные утеплённые зоны под трибунами.</div>');
    const S=9000; // шкала баров, кВт
    function upd(){
      const t=+document.getElementById('fxT').value, dT=10-t;
      const q1=7400*1.8*dT/1000, q2lo=26600*2.0*dT/1000, q2hi=26600*5.6*dT/1000, q3=1.2*1.005*0.3*500000/3600*dT;
      const lo=q1+q2lo+q3, hi=q1+q2hi+q3;
      document.getElementById('fxTv').textContent=(t<0?'−'+(-t):t)+' °C';
      document.getElementById('fxMw').textContent='≈ '+(lo/1000).toFixed(1)+'…'+(hi/1000).toFixed(1)+' МВт';
      document.getElementById('fxGc').textContent='= '+(lo*0.8598/1000).toFixed(1)+'…'+(hi*0.8598/1000).toFixed(1)+' Гкал/ч · ΔT = '+dT+' К';
      const set=(id,v)=>{document.getElementById(id).style.width=(v/S*100).toFixed(1)+'%'};
      set('fxB1',q1); set('fxB3',q3);
      const b2=document.getElementById('fxB2');
      b2.style.left=(q2lo/S*100).toFixed(1)+'%'; b2.style.width=((q2hi-q2lo)/S*100).toFixed(1)+'%';
      document.getElementById('fxB1v').textContent='≈ '+(q1/1000).toFixed(2)+' МВт';
      document.getElementById('fxB2v').textContent='≈ '+(q2lo/1000).toFixed(1)+'…'+(q2hi/1000).toFixed(1)+' МВт';
      document.getElementById('fxB3v').textContent='≈ '+(q3/1000).toFixed(1)+' МВт';
    }
    document.getElementById('fxT').addEventListener('input',upd); upd();
  }

  /* ---------- 04 · снеговые мешки ---------- */
  function rMeshki(pane,f){
    paneHead(pane,'04 / Ключевой риск','Снеговые мешки в долинах полос и варианты их исключения',f.meshki.lead);
    pane.insertAdjacentHTML('beforeend',
      '<div class="fxMeshki"><div class="fxScheme" id="fxScheme"></div>'+
      '<div><div class="fxVars" id="fxVars"></div><div class="fxVPanel" id="fxVPanel"></div></div></div>');
    drawScheme(document.getElementById('fxScheme'),'gutter');
    const vars=document.getElementById('fxVars'), panel=document.getElementById('fxVPanel');
    f.meshki.variants.forEach((v,i)=>{
      const b=document.createElement('button');
      b.className='fxVar'+(i===0?' cur':'');
      b.innerHTML='<span class="dot"></span>'+v.label;
      b.addEventListener('click',()=>{
        vars.querySelectorAll('.fxVar').forEach(x=>x.classList.remove('cur'));
        b.classList.add('cur'); drawScheme(document.getElementById('fxScheme'),v.id); showVar(panel,v);
      });
      vars.appendChild(b);
    });
    showVar(panel,f.meshki.variants[0]);
  }
  function showVar(panel,v){
    panel.innerHTML='<h3>'+v.title+'</h3><span class="fxVStatus '+v.cls+'">'+v.status+'</span>'+
      '<p>'+v.text+'</p>'+
      '<p class="k"><b>Как исключает мешок.</b> '+v.kills+'</p>'+
      '<p class="k"><b>Ограничения.</b> '+v.limits+'</p>'+
      '<div class="src">Основание: '+v.src+'</div>';
  }
  function drawScheme(box,variant){
    /* разрез поперёк полос: две линзы, долина с кассетой, канат, снеговой мешок */
    const base=
      '<line x1="30" y1="252" x2="790" y2="252" stroke="rgba(255,255,255,.25)" stroke-width="1"/>'+   // низ подушек +13.0
      '<line x1="30" y1="262" x2="790" y2="262" stroke="rgba(255,255,255,.12)" stroke-width="1" stroke-dasharray="2 4"/>'+ // верх ферм +12.1
      '<path d="M60,250 Q210,120 360,250" fill="rgba(95,168,199,.07)" stroke="#7ea6c4" stroke-width="2"/>'+
      '<path d="M460,250 Q610,120 760,250" fill="rgba(95,168,199,.07)" stroke="#7ea6c4" stroke-width="2"/>'+
      '<path d="M60,250 Q210,245 360,250" fill="none" stroke="#7ea6c4" stroke-width="1.2"/>'+
      '<path d="M460,250 Q610,245 760,250" fill="none" stroke="#7ea6c4" stroke-width="1.2"/>'+
      '<rect x="352" y="250" width="116" height="18" fill="rgba(201,162,39,.18)" stroke="rgba(201,162,39,.5)"/>'+  // кассета
      '<text x="410" y="284" fill="#c9a227" font-size="10.5" font-family="var(--mono)" text-anchor="middle">КАССЕТА · СТЫК ПОЛОС</text>'+
      '<text x="210" y="115" fill="#9aa3b8" font-size="10.5" font-family="var(--mono)" text-anchor="middle">ЛИНЗА · СТРЕЛКА 2,6 М</text>'+
      '<text x="205" y="305" fill="#9aa3b8" font-size="10.5" font-family="var(--mono)" text-anchor="middle">ПОЛОСА 6,41 М · ПРОЛЁТ 68 М (ИЗ ПЛОСКОСТИ)</text>'+
      '<text x="36" y="246" fill="#69707a" font-size="9.5" font-family="var(--mono)">+13,0</text>'+
      '<text x="36" y="272" fill="#69707a" font-size="9.5" font-family="var(--mono)">+12,1</text>';
    const drift='<g id="fxDrift"><path d="M360,250 L410,182 L460,250 Z" fill="rgba(255,255,255,.82)" stroke="#fff" stroke-width="1"/>'+
      '<path d="M330,250 L360,208 L360,250 Z" fill="rgba(255,255,255,.45)"/><path d="M460,250 L490,208 L460,250 Z" fill="rgba(255,255,255,.45)"/>'+
      '<text x="410" y="170" fill="#fff" font-size="10.5" font-family="var(--mono)" text-anchor="middle">СНЕГОВОЙ МЕШОК · μ до 4–6</text></g>';
    const L={
      gutter:'<g><rect x="356" y="248" width="108" height="12" rx="4" fill="none" stroke="#d9a24a" stroke-width="2"/>'+
        '<path d="M380,262 v38 M440,262 v38" stroke="#5fa8c7" stroke-width="2" marker-end="url(#fxDn)"/>'+
        '<text x="410" y="318" fill="#d9a24a" font-size="10.5" font-family="var(--mono)" text-anchor="middle">ОБОГРЕВАЕМЫЙ ЛОТОК → ТАЛАЯ ВОДА В ТЁПЛЫЙ ВОДОСТОК</text></g>',
      cables:'<g><line x1="346" y1="270" x2="474" y2="270" stroke="#e0bc45" stroke-width="2.5"/>'+
        '<circle cx="410" cy="270" r="4" fill="#e0bc45"/>'+
        '<path d="M360,250 Q410,272 460,250" fill="none" stroke="#fff" stroke-width="1.6" stroke-dasharray="5 4"/>'+
        '<text x="600" y="274" fill="#e0bc45" font-size="10.5" font-family="var(--mono)">КАНАТ Z = 13,0 · ПРИНИМАЕТ СНЕГ ПРИ СДУТИИ</text></g>',
      pressure:'<g>'+[150,210,270,550,610,670].map(x=>
        '<path d="M'+x+',244 v-52" stroke="#e0bc45" stroke-width="2" marker-end="url(#fxUp)"/>').join('')+
        '<rect x="688" y="182" width="104" height="26" rx="13" fill="none" stroke="#5fa8c7"/>'+
        '<text x="740" y="199" fill="#5fa8c7" font-size="10" font-family="var(--mono)" text-anchor="middle">ДАТЧИК СНЕГА</text>'+
        '<text x="410" y="330" fill="#e0bc45" font-size="10.5" font-family="var(--mono)" text-anchor="middle">220–300 Па → 500–700 Па ПЛАВНО · ДАВЛЕНИЕ ВЫШЕ СНЕГОВОЙ НАГРУЗКИ ДЕРЖИТ ФОРМУ</text></g>',
      infill:'<g><path d="M360,250 Q410,196 460,250 Z" fill="rgba(224,188,69,.30)" stroke="#e0bc45" stroke-width="2"/>'+
        '<text x="410" y="170" fill="#e0bc45" font-size="10.5" font-family="var(--mono)" text-anchor="middle">ЗАПОЛНЯЮЩИЙ ЭЛЕМЕНТ · ДОЛИНЫ НЕТ</text>'+
        '<text x="410" y="330" fill="#9aa3b8" font-size="10" font-family="var(--mono)" text-anchor="middle">СТЫК ОСТАЁТСЯ РАЗЪЁМНЫМ ПРИ ВЫДВИЖЕНИИ ПОЛОС · ТРЕБУЕТ ОПЫТНОЙ ПРОВЕРКИ</text></g>',
      heat:'<g>'+[120,200,280,540,620,700].map(x=>
        '<path d="M'+x+',322 q6,-14 0,-28 q-6,-14 0,-28" fill="none" stroke="#c23b2a" stroke-width="2" marker-end="url(#fxUpR)"/>').join('')+
        '<path d="M300,244 L360,244 M460,244 L520,244" stroke="#5fa8c7" stroke-width="3"/>'+
        '<path d="M330,216 L362,240 M490,216 L458,240" stroke="#5fa8c7" stroke-width="2" marker-end="url(#fxDnB)"/>'+
        '<text x="410" y="338" fill="#c23b2a" font-size="10.5" font-family="var(--mono)" text-anchor="middle">ПОДОГРЕВ ЧАШИ · ct &lt; 1 · СНЕГ ПОДТАЕТ СНИЗУ И СПОЛЗАЕТ В ЛОТКИ</text></g>',
      slope:'<g><path d="M340,250 A22,22 0 0 0 352,232" fill="none" stroke="#7fb685" stroke-width="2"/>'+
        '<path d="M480,250 A22,22 0 0 1 468,232" fill="none" stroke="#7fb685" stroke-width="2"/>'+
        '<path d="M300,230 L352,246 M520,230 L468,246" stroke="#7fb685" stroke-width="2" marker-end="url(#fxDnG)"/>'+
        '<text x="410" y="330" fill="#7fb685" font-size="10.5" font-family="var(--mono)" text-anchor="middle">УКЛОНЫ КРОМОК СТОЯТ И ПРИ СДУТОЙ ПОДУШКЕ · СТОК НЕ ПРЕКРАЩАЕТСЯ</text></g>'
    };
    const driftShown=(variant==='infill')?'':(variant==='pressure'?drift.replace('M360,250 L410,182 L460,250','M360,250 L410,214 L460,250').replace('μ до 4–6','МЕШОК НЕ ФОРМИРУЕТСЯ'):drift);
    box.innerHTML='<svg viewBox="0 0 820 350">'
      +'<defs>'
      +'<marker id="fxUp" markerWidth="7" markerHeight="7" refX="3.5" refY="1" orient="auto"><path d="M0,7 L3.5,0 L7,7 z" fill="#e0bc45"/></marker>'
      +'<marker id="fxUpR" markerWidth="7" markerHeight="7" refX="3.5" refY="1" orient="auto"><path d="M0,7 L3.5,0 L7,7 z" fill="#c23b2a"/></marker>'
      +'<marker id="fxDn" markerWidth="7" markerHeight="7" refX="3.5" refY="6" orient="auto"><path d="M0,0 L3.5,7 L7,0 z" fill="#5fa8c7"/></marker>'
      +'<marker id="fxDnB" markerWidth="7" markerHeight="7" refX="3.5" refY="6" orient="auto"><path d="M0,0 L3.5,7 L7,0 z" fill="#5fa8c7"/></marker>'
      +'<marker id="fxDnG" markerWidth="7" markerHeight="7" refX="3.5" refY="6" orient="auto"><path d="M0,0 L3.5,7 L7,0 z" fill="#7fb685"/></marker>'
      +'</defs>'+base+driftShown+(L[variant]||'')+
      '<text x="410" y="16" fill="#69707a" font-size="9.5" font-family="var(--mono)" text-anchor="middle">РАЗРЕЗ ПОПЕРЁК ПОЛОС · СХЕМА НЕ В МАСШТАБЕ ПО ВЕРТИКАЛИ</text></svg>';
  }

  /* ---------- 05 · аварии ---------- */
  function rTimeline(pane,f){
    paneHead(pane,'05 / Опыт аналогов','Документированные аварии пневматических покрытий',
      'Ни одна авария не вызвана холодным климатом как таковым: все три — сочетание снега и льда с отключённым снеготаянием, замёрзшим дренажом и человеческим фактором.');
    pane.insertAdjacentHTML('beforeend','<div class="fxTime">'+f.timeline.map(e=>
      '<div class="fxEv"><div class="y">'+e.year+'</div><div><h3>'+e.name+'</h3><p>'+e.what+'</p>'+
      '<div class="les"><b>Урок</b>'+e.lesson+'</div></div></div>').join('')+'</div>');
  }

  /* ---------- 06 · решения и регламент ---------- */
  function rChecklist(pane,f){
    paneHead(pane,'06 / Инженерные решения','Решения по покрытию и регламент зимней эксплуатации',
      'Комплекс мер, исключающих эксплуатационные риски зимой в Красноярске: конструктив, системы, мониторинг, регламент.');
    pane.insertAdjacentHTML('beforeend','<div class="fxGroups">'+f.checklist.map(g=>
      '<div class="fxGroup"><h3>'+g.title+'</h3><ul>'+g.items.map(i=>'<li>'+i+'</li>').join('')+'</ul></div>').join('')+'</div>');
  }

  /* ---------- 07 · выводы ---------- */
  function rConclusions(pane,f){
    paneHead(pane,'07 / Итог','Выводы и источники','');
    pane.insertAdjacentHTML('beforeend','<ol class="fxConcl">'+f.conclusions.map(c=>'<li>'+c+'</li>').join('')+'</ol>');
    pane.insertAdjacentHTML('beforeend','<details class="fxSrc"><summary>Источники ('+f.sources.length+')</summary><ol>'+
      f.sources.map(s=>'<li>'+s+'</li>').join('')+'</ol></details>');
  }

  renderAll();
})();
</script>
